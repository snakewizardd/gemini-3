<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Agent - Stealth Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            gap: 10px;
        }
        #gameCanvas {
            border: 4px solid #333;
            image-rendering: pixelated;
            background: #1a1a2e;
        }
        #hud {
            color: #0f0;
            font-size: 16px;
            display: flex;
            gap: 30px;
            text-shadow: 0 0 10px #0f0;
        }
        .hud-item { display: flex; align-items: center; gap: 8px; }
        #instructions {
            color: #666;
            font-size: 12px;
            text-align: center;
        }
        #gameOver {
            position: absolute;
            color: #f00;
            font-size: 48px;
            text-shadow: 0 0 20px #f00;
            display: none;
        }
        #victory {
            position: absolute;
            color: #0f0;
            font-size: 48px;
            text-shadow: 0 0 20px #0f0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-item">❤️ HEALTH: <span id="health">100</span></div>
        <div class="hud-item">🔫 AMMO: <span id="ammo">30</span></div>
        <div class="hud-item">💀 KILLS: <span id="kills">0</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="instructions">WASD - Move | SPACE - Shoot | Stay in shadows, eliminate targets</div>
    <div id="gameOver">MISSION FAILED<br><span style="font-size:20px">Press R to restart</span></div>
    <div id="victory">MISSION COMPLETE<br><span style="font-size:20px">Press R to restart</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthEl = document.getElementById('health');
        const ammoEl = document.getElementById('ammo');
        const killsEl = document.getElementById('kills');
        const gameOverEl = document.getElementById('gameOver');
        const victoryEl = document.getElementById('victory');

        // Game state
        let gameRunning = true;
        let keys = {};
        let bullets = [];
        let enemyBullets = [];
        let ammoDrops = [];
        let particles = [];
        let kills = 0;

        // Player
        const player = {
            x: 100,
            y: 300,
            width: 20,
            height: 20,
            speed: 3,
            health: 100,
            ammo: 30,
            direction: { x: 1, y: 0 },
            shootCooldown: 0
        };

        // Walls - warehouse/office layout
        const walls = [
            // Outer walls
            { x: 0, y: 0, w: 800, h: 20 },
            { x: 0, y: 580, w: 800, h: 20 },
            { x: 0, y: 0, w: 20, h: 600 },
            { x: 780, y: 0, w: 20, h: 600 },
            
            // Office rooms top-left
            { x: 20, y: 100, w: 150, h: 15 },
            { x: 150, y: 20, w: 15, h: 120 },
            
            // Storage area top-right
            { x: 500, y: 20, w: 15, h: 150 },
            { x: 500, y: 150, w: 150, h: 15 },
            { x: 650, y: 80, w: 130, h: 15 },
            
            // Central obstacles (crates)
            { x: 300, y: 200, w: 60, h: 60 },
            { x: 380, y: 280, w: 40, h: 40 },
            { x: 450, y: 200, w: 50, h: 70 },
            
            // Bottom office/rooms
            { x: 20, y: 400, w: 15, h: 180 },
            { x: 20, y: 400, w: 120, h: 15 },
            { x: 200, y: 450, w: 15, h: 130 },
            { x: 200, y: 450, w: 100, h: 15 },
            
            // Right side storage
            { x: 600, y: 350, w: 15, h: 230 },
            { x: 600, y: 350, w: 100, h: 15 },
            { x: 680, y: 420, w: 100, h: 15 },
            
            // Middle corridor walls
            { x: 250, y: 300, w: 15, h: 100 },
            { x: 550, y: 250, w: 15, h: 80 }
        ];

        // Patrol points for enemies
        const patrolRoutes = [
            [{ x: 200, y: 60 }, { x: 400, y: 60 }, { x: 400, y: 180 }, { x: 200, y: 180 }],
            [{ x: 550, y: 400 }, { x: 550, y: 500 }, { x: 700, y: 500 }, { x: 700, y: 400 }],
            [{ x: 100, y: 480 }, { x: 180, y: 480 }, { x: 180, y: 550 }, { x: 100, y: 550 }],
            [{ x: 300, y: 400 }, { x: 500, y: 400 }, { x: 500, y: 550 }, { x: 300, y: 550 }],
            [{ x: 600, y: 200 }, { x: 750, y: 200 }, { x: 750, y: 320 }, { x: 600, y: 320 }]
        ];

        // Enemies
        let enemies = [];
        
        function initEnemies() {
            enemies = [];
            for (let i = 0; i < 5; i++) {
                const route = patrolRoutes[i];
                enemies.push({
                    x: route[0].x,
                    y: route[0].y,
                    width: 18,
                    height: 18,
                    speed: 1.5,
                    health: 3,
                    patrolRoute: route,
                    patrolIndex: 0,
                    state: 'patrol', // patrol, chase, attack
                    direction: { x: 1, y: 0 },
                    shootCooldown: 0,
                    alertTimer: 0,
                    viewDistance: 150,
                    viewAngle: Math.PI / 3
                });
            }
        }

        function resetGame() {
            player.x = 100;
            player.y = 300;
            player.health = 100;
            player.ammo = 30;
            player.direction = { x: 1, y: 0 };
            bullets = [];
            enemyBullets = [];
            ammoDrops = [];
            particles = [];
            kills = 0;
            gameRunning = true;
            gameOverEl.style.display = 'none';
            victoryEl.style.display = 'none';
            initEnemies();
        }

        // Collision detection
        function rectCollision(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.height > r2.y;
        }

        function pointInRect(px, py, rect) {
            return px >= rect.x && px <= rect.x + rect.w &&
                   py >= rect.y && py <= rect.y + rect.h;
        }

        function lineIntersectsRect(x1, y1, x2, y2, rect) {
            // Check if line intersects rectangle
            const left = lineIntersectsLine(x1, y1, x2, y2, rect.x, rect.y, rect.x, rect.y + rect.h);
            const right = lineIntersectsLine(x1, y1, x2, y2, rect.x + rect.w, rect.y, rect.x + rect.w, rect.y + rect.h);
            const top = lineIntersectsLine(x1, y1, x2, y2, rect.x, rect.y, rect.x + rect.w, rect.y);
            const bottom = lineIntersectsLine(x1, y1, x2, y2, rect.x, rect.y + rect.h, rect.x + rect.w, rect.y + rect.h);
            return left || right || top || bottom;
        }

        function lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4) {
            const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return false;
            const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
        }

        function canSee(from, to) {
            const fx = from.x + from.width / 2;
            const fy = from.y + from.height / 2;
            const tx = to.x + to.width / 2;
            const ty = to.y + to.height / 2;
            
            for (const wall of walls) {
                if (lineIntersectsRect(fx, fy, tx, ty, wall)) {
                    return false;
                }
            }
            return true;
        }

        function distance(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyR' && !gameRunning) {
                resetGame();
            }
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // Spawn particles
        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 30,
                    color
                });
            }
        }

        // Update functions
        function updatePlayer() {
            let dx = 0, dy = 0;
            
            if (keys['KeyW']) dy = -1;
            if (keys['KeyS']) dy = 1;
            if (keys['KeyA']) dx = -1;
            if (keys['KeyD']) dx = 1;
            
            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }
            
            // Update direction for shooting
            if (dx !== 0 || dy !== 0) {
                player.direction.x = dx;
                player.direction.y = dy;
            }
            
            // Move with collision
            const newX = player.x + dx * player.speed;
            const newY = player.y + dy * player.speed;
            
            let canMoveX = true, canMoveY = true;
            const testRectX = { x: newX, y: player.y, width: player.width, height: player.height };
            const testRectY = { x: player.x, y: newY, width: player.width, height: player.height };
            
            for (const wall of walls) {
                if (rectCollision(testRectX, { x: wall.x, y: wall.y, w: wall.w, h: wall.h, width: 0, height: 0 })) canMoveX = false;
                if (rectCollision(testRectY, { x: wall.x, y: wall.y, w: wall.w, h: wall.h, width: 0, height: 0 })) canMoveY = false;
            }
            
            if (canMoveX) player.x = newX;
            if (canMoveY) player.y = newY;
            
            // Shooting
            if (player.shootCooldown > 0) player.shootCooldown--;
            
            if (keys['Space'] && player.shootCooldown === 0 && player.ammo > 0) {
                const len = Math.sqrt(player.direction.x ** 2 + player.direction.y ** 2);
                bullets.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (player.direction.x / len) * 8,
                    vy: (player.direction.y / len) * 8,
                    life: 100
                });
                player.ammo--;
                player.shootCooldown = 15;
                spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0', 3);
            }
            
            // Pickup ammo
            for (let i = ammoDrops.length - 1; i >= 0; i--) {
                const drop = ammoDrops[i];
                if (distance(player, drop) < 25) {
                    player.ammo += 5;
                    ammoDrops.splice(i, 1);
                }
            }
        }

        function updateEnemies() {
            for (const enemy of enemies) {
                if (enemy.health <= 0) continue;
                
                const dist = distance(enemy, player);
                const canSeePlayer = dist < enemy.viewDistance && canSee(enemy, player);
                
                // State machine
                if (canSeePlayer) {
                    enemy.state = 'chase';
                    enemy.alertTimer = 180; // Stay alert for 3 seconds
                } else if (enemy.alertTimer > 0) {
                    enemy.alertTimer--;
                    if (enemy.alertTimer === 0) enemy.state = 'patrol';
                }
                
                let targetX, targetY;
                
                if (enemy.state === 'chase') {
                    targetX = player.x;
                    targetY = player.y;
                    
                    // Shoot at player
                    if (enemy.shootCooldown > 0) enemy.shootCooldown--;
                    if (enemy.shootCooldown === 0 && canSeePlayer) {
                        const dx = player.x - enemy.x;
                        const dy = player.y - enemy.y;
                        const len = Math.sqrt(dx * dx + dy * dy);
                        enemyBullets.push({
                            x: enemy.x + enemy.width / 2,
                            y: enemy.y + enemy.height / 2,
                            vx: (dx / len) * 5,
                            vy: (dy / len) * 5,
                            life: 80
                        });
                        enemy.shootCooldown = 60;
                    }
                } else {
                    // Patrol
                    const patrolPoint = enemy.patrolRoute[enemy.patrolIndex];
                    targetX = patrolPoint.x;
                    targetY = patrolPoint.y;
                    
                    if (distance(enemy, patrolPoint) < 5) {
                        enemy.patrolIndex = (enemy.patrolIndex + 1) % enemy.patrolRoute.length;
                    }
                }
                
                // Move towards target
                const dx = targetX - enemy.x;
                const dy = targetY - enemy.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                
                if (len > 5) {
                    const speed = enemy.state === 'chase' ? enemy.speed * 1.5 : enemy.speed;
                    const moveX = (dx / len) * speed;
                    const moveY = (dy / len) * speed;
                    
                    enemy.direction.x = dx / len;
                    enemy.direction.y = dy / len;
                    
                    // Check wall collision
                    let canMoveX = true, canMoveY = true;
                    const testX = { x: enemy.x + moveX, y: enemy.y, width: enemy.width, height: enemy.height };
                    const testY = { x: enemy.x, y: enemy.y + moveY, width: enemy.width, height: enemy.height };
                    
                    for (const wall of walls) {
                        if (rectCollision(testX, { x: wall.x, y: wall.y, w: wall.w, h: wall.h, width: 0, height: 0 })) canMoveX = false;
                        if (rectCollision(testY, { x: wall.x, y: wall.y, w: wall.w, h: wall.h, width: 0, height: 0 })) canMoveY = false;
                    }
                    
                    if (canMoveX) enemy.x += moveX;
                    if (canMoveY) enemy.y += moveY;
                }
            }
        }

        function updateBullets() {
            // Player bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                
                let hit = false;
                
                // Wall collision
                for (const wall of walls) {
                    if (pointInRect(b.x, b.y, wall)) {
                        hit = true;
                        spawnParticles(b.x, b.y, '#888', 3);
                        break;
                    }
                }
                
                // Enemy collision
                if (!hit) {
                    for (const enemy of enemies) {
                        if (enemy.health <= 0) continue;
                        if (b.x > enemy.x && b.x < enemy.x + enemy.width &&
                            b.y > enemy.y && b.y < enemy.y + enemy.height) {
                            enemy.health--;
                            hit = true;
                            spawnParticles(b.x, b.y, '#f00', 5);
                            
                            if (enemy.health <= 0) {
                                kills++;
                                // Drop ammo
                                ammoDrops.push({ x: enemy.x, y: enemy.y });
                                spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#f00', 15);
                            }
                            break;
                        }
                    }
                }
                
                if (hit || b.life <= 0) bullets.splice(i, 1);
            }
            
            // Enemy bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                
                let hit = false;
                
                // Wall collision
                for (const wall of walls) {
                    if (pointInRect(b.x, b.y, wall)) {
                        hit = true;
                        spawnParticles(b.x, b.y, '#888', 3);
                        break;
                    }
                }
                
                // Player collision
                if (!hit && b.x > player.x && b.x < player.x + player.width &&
                    b.y > player.y && b.y < player.y + player.height) {
                    player.health -= 10;
                    hit = true;
                    spawnParticles(b.x, b.y, '#f00', 5);
                }
                
                if (hit || b.life <= 0) enemyBullets.splice(i, 1);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Drawing functions
        function drawPixelRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Floor pattern
            ctx.fillStyle = '#16162a';
            for (let x = 0; x < canvas.width; x += 40) {
                for (let y = 0; y < canvas.height; y += 40) {
                    if ((x + y) % 80 === 0) {
                        ctx.fillRect(x, y, 40, 40);
                    }
                }
            }
            
            // Walls
            for (const wall of walls) {
                // Wall shadow
                ctx.fillStyle = '#222';
                ctx.fillRect(wall.x + 3, wall.y + 3, wall.w, wall.h);
                // Wall
                ctx.fillStyle = '#444';
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                // Wall highlight
                ctx.fillStyle = '#555';
                ctx.fillRect(wall.x, wall.y, wall.w, 2);
                ctx.fillRect(wall.x, wall.y, 2, wall.h);
            }
            
            // Ammo drops
            for (const drop of ammoDrops) {
                ctx.fillStyle = '#ff0';
                ctx.fillRect(drop.x + 2, drop.y + 2, 14, 14);
                ctx.fillStyle = '#aa0';
                ctx.fillRect(drop.x + 4, drop.y + 4, 10, 10);
                ctx.fillStyle = '#ff0';
                ctx.font = '10px Courier';
                ctx.fillText('A', drop.x + 5, drop.y + 13);
            }
            
            // Enemy view cones (when patrolling)
            for (const enemy of enemies) {
                if (enemy.health <= 0) continue;
                if (enemy.state === 'patrol') {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.1)';
                    ctx.beginPath();
                    const ex = enemy.x + enemy.width / 2;
                    const ey = enemy.y + enemy.height / 2;
                    const angle = Math.atan2(enemy.direction.y, enemy.direction.x);
                    ctx.moveTo(ex, ey);
                    ctx.arc(ex, ey, enemy.viewDistance, angle - enemy.viewAngle/2, angle + enemy.viewAngle/2);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            
            // Enemies
            for (const enemy of enemies) {
                if (enemy.health <= 0) continue;
                
                const color = enemy.state === 'chase' ? '#f44' : '#c33';
                const ex = Math.floor(enemy.x);
                const ey = Math.floor(enemy.y);
                
                // Body
                drawPixelRect(ex, ey, enemy.width, enemy.height, color);
                // Head
                drawPixelRect(ex + 4, ey + 2, 10, 10, '#fdb');
                // Eyes
                drawPixelRect(ex + 6 + enemy.direction.x * 2, ey + 5, 2, 2, '#000');
                drawPixelRect(ex + 10 + enemy.direction.x * 2, ey + 5, 2, 2, '#000');
                
                // Health bar
                ctx.fillStyle = '#300';
                ctx.fillRect(ex, ey - 6, enemy.width, 3);
                ctx.fillStyle = '#f00';
                ctx.fillRect(ex, ey - 6, (enemy.health / 3) * enemy.width, 3);
                
                // Alert indicator
                if (enemy.state === 'chase') {
                    ctx.fillStyle = '#f00';
                    ctx.font = 'bold 14px Courier';
                    ctx.fillText('!', ex + 7, ey - 10);
                }
            }
            
            // Player
            const px = Math.floor(player.x);
            const py = Math.floor(player.y);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(px + 2, py + 2, player.width, player.height);
            
            // Body (suit)
            drawPixelRect(px, py, player.width, player.height, '#222');
            // Tie
            drawPixelRect(px + 9, py + 8, 2, 8, '#a00');
            // Head
            drawPixelRect(px + 4, py + 2, 12, 10, '#fdb');
            // Eyes
            drawPixelRect(px + 6 + player.direction.x * 2, py + 5, 2, 2, '#000');
            drawPixelRect(px + 12 + player.direction.x * 2, py + 5, 2, 2, '#000');
            
            // Gun
            const gunX = px + player.width/2 + player.direction.x * 12;
            const gunY = py + player.height/2 + player.direction.y * 12;
            ctx.fillStyle = '#444';
            ctx.fillRect(gunX - 3, gunY - 2, 6, 4);
            
            // Bullets
            ctx.fillStyle = '#ff0';
            for (const b of bullets) {
                ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            }
            
            ctx.fillStyle = '#f80';
            for (const b of enemyBullets) {
                ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            }
            
            // Particles
            for (const p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
            }
            ctx.globalAlpha = 1;
            
            // Update HUD
            healthEl.textContent = Math.max(0, player.health);
            ammoEl.textContent = player.ammo;
            killsEl.textContent = kills;
            
            // Health color
            healthEl.style.color = player.health > 50 ? '#0f0' : player.health > 25 ? '#ff0' : '#f00';
        }

        function checkGameState() {
            if (player.health <= 0) {
                gameRunning = false;
                gameOverEl.style.display = 'block';
            }
            
            const aliveEnemies = enemies.filter(e => e.health > 0).length;
            if (aliveEnemies === 0) {
                gameRunning = false;
                victoryEl.style.display = 'block';
            }
        }

        function gameLoop() {
            if (gameRunning) {
                updatePlayer();
                updateEnemies();
                updateBullets();
                updateParticles();
                checkGameState();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        initEnemies();
        gameLoop();
    </script>
</body>
</html>
