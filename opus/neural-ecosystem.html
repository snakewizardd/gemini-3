<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Ecosystem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #00ff88; margin-bottom: 10px; text-shadow: 0 0 10px #00ff8855; }
        #stats {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .stat { background: #16213e; padding: 8px 15px; border-radius: 20px; }
        .stat span { color: #00ff88; font-weight: bold; }
        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px #00ff8833;
        }
        #controls { margin-top: 15px; display: flex; gap: 10px; }
        button {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #00ff88; }
        #info { margin-top: 15px; font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <h1>🧬 Neural Ecosystem</h1>
    <div id="stats">
        <div class="stat">Creatures: <span id="creatureCount">0</span></div>
        <div class="stat">Food: <span id="foodCount">0</span></div>
        <div class="stat">Generation: <span id="generation">1</span></div>
        <div class="stat">Time: <span id="time">0</span>s</div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <button onclick="addFood(20)">+ Add Food</button>
        <button onclick="addCreature()">+ Add Creature</button>
        <button onclick="togglePause()">Pause/Resume</button>
    </div>
    <div id="info">
        🟢 Green = Creatures (brightness = energy) | 🔴 Red = Food<br>
        Creatures use neural networks to find food, survive, and reproduce!
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        let creatures = [];
        let food = [];
        let paused = false;
        let time = 0;
        let maxGeneration = 1;

        // Simple Neural Network
        class NeuralNetwork {
            constructor(inputSize, hiddenSize, outputSize) {
                this.weightsIH = this.randomMatrix(hiddenSize, inputSize);
                this.weightsHO = this.randomMatrix(outputSize, hiddenSize);
                this.biasH = this.randomArray(hiddenSize);
                this.biasO = this.randomArray(outputSize);
            }

            randomMatrix(rows, cols) {
                return Array(rows).fill().map(() => 
                    Array(cols).fill().map(() => Math.random() * 2 - 1)
                );
            }

            randomArray(size) {
                return Array(size).fill().map(() => Math.random() * 2 - 1);
            }

            activate(x) {
                return Math.tanh(x);
            }

            forward(inputs) {
                // Input to hidden
                let hidden = this.weightsIH.map((row, i) => {
                    let sum = row.reduce((acc, w, j) => acc + w * inputs[j], 0);
                    return this.activate(sum + this.biasH[i]);
                });

                // Hidden to output
                let outputs = this.weightsHO.map((row, i) => {
                    let sum = row.reduce((acc, w, j) => acc + w * hidden[j], 0);
                    return this.activate(sum + this.biasO[i]);
                });

                return outputs;
            }

            clone() {
                let nn = new NeuralNetwork(1, 1, 1);
                nn.weightsIH = this.weightsIH.map(row => [...row]);
                nn.weightsHO = this.weightsHO.map(row => [...row]);
                nn.biasH = [...this.biasH];
                nn.biasO = [...this.biasO];
                return nn;
            }

            mutate(rate = 0.1) {
                const mutateValue = (v) => {
                    if (Math.random() < rate) {
                        return v + (Math.random() * 2 - 1) * 0.5;
                    }
                    return v;
                };

                this.weightsIH = this.weightsIH.map(row => row.map(mutateValue));
                this.weightsHO = this.weightsHO.map(row => row.map(mutateValue));
                this.biasH = this.biasH.map(mutateValue);
                this.biasO = this.biasO.map(mutateValue);
            }
        }

        // Creature class
        class Creature {
            constructor(x, y, brain = null, generation = 1) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.radius = 8;
                this.energy = 100;
                this.maxEnergy = 150;
                this.speed = 3;
                this.angle = Math.random() * Math.PI * 2;
                this.generation = generation;
                
                // Neural network: 6 inputs, 8 hidden, 2 outputs (turn, speed)
                // Inputs: nearest food direction (2), distance (1), energy (1), wall distances (2)
                this.brain = brain || new NeuralNetwork(6, 8, 2);
            }

            findNearestFood() {
                let nearest = null;
                let minDist = Infinity;

                for (let f of food) {
                    let dx = f.x - this.x;
                    let dy = f.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = f;
                    }
                }

                return { food: nearest, distance: minDist };
            }

            getInputs() {
                let { food: nearestFood, distance } = this.findNearestFood();
                
                let foodDirX = 0, foodDirY = 0;
                if (nearestFood) {
                    let dx = nearestFood.x - this.x;
                    let dy = nearestFood.y - this.y;
                    let len = Math.sqrt(dx * dx + dy * dy) || 1;
                    foodDirX = dx / len;
                    foodDirY = dy / len;
                }

                // Normalize inputs
                return [
                    foodDirX,
                    foodDirY,
                    Math.min(distance, 500) / 500,
                    this.energy / this.maxEnergy,
                    this.x / canvas.width,
                    this.y / canvas.height
                ];
            }

            update() {
                // Get neural network decision
                let inputs = this.getInputs();
                let outputs = this.brain.forward(inputs);

                // Apply outputs
                this.angle += outputs[0] * 0.3;
                let speedMod = (outputs[1] + 1) / 2; // 0 to 1
                let currentSpeed = this.speed * (0.5 + speedMod * 0.5);

                // Move
                this.x += Math.cos(this.angle) * currentSpeed;
                this.y += Math.sin(this.angle) * currentSpeed;

                // Wrap around edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Energy cost
                this.energy -= 0.15 + currentSpeed * 0.05;

                // Eat food
                for (let i = food.length - 1; i >= 0; i--) {
                    let f = food[i];
                    let dx = f.x - this.x;
                    let dy = f.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < this.radius + f.radius) {
                        this.energy = Math.min(this.maxEnergy, this.energy + f.energy);
                        food.splice(i, 1);
                    }
                }

                // Reproduce if enough energy
                if (this.energy > 120 && creatures.length < 100) {
                    this.reproduce();
                }

                return this.energy > 0;
            }

            reproduce() {
                this.energy -= 50;
                let childBrain = this.brain.clone();
                childBrain.mutate(0.15);
                
                let child = new Creature(
                    this.x + (Math.random() - 0.5) * 30,
                    this.y + (Math.random() - 0.5) * 30,
                    childBrain,
                    this.generation + 1
                );
                child.energy = 50;
                creatures.push(child);

                if (child.generation > maxGeneration) {
                    maxGeneration = child.generation;
                }
            }

            draw() {
                // Body
                let energyRatio = this.energy / this.maxEnergy;
                let green = Math.floor(100 + energyRatio * 155);
                ctx.fillStyle = `rgb(0, ${green}, ${Math.floor(green * 0.5)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Direction indicator
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(
                    this.x + Math.cos(this.angle) * this.radius * 1.5,
                    this.y + Math.sin(this.angle) * this.radius * 1.5
                );
                ctx.stroke();

                // Energy bar
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 10, this.y - 15, 20, 3);
                ctx.fillStyle = energyRatio > 0.3 ? '#0f0' : '#f00';
                ctx.fillRect(this.x - 10, this.y - 15, 20 * energyRatio, 3);
            }
        }

        // Food class
        class Food {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.radius = 5;
                this.energy = 30;
            }

            draw() {
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ff8888';
                ctx.beginPath();
                ctx.arc(this.x - 1, this.y - 1, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize
        function init() {
            creatures = [];
            food = [];
            
            for (let i = 0; i < 15; i++) {
                creatures.push(new Creature());
            }
            
            for (let i = 0; i < 50; i++) {
                food.push(new Food());
            }
        }

        function addFood(count = 1) {
            for (let i = 0; i < count; i++) {
                food.push(new Food());
            }
        }

        function addCreature() {
            creatures.push(new Creature());
        }

        function togglePause() {
            paused = !paused;
        }

        // Game loop
        function update() {
            if (!paused) {
                time += 1/60;

                // Spawn food periodically
                if (Math.random() < 0.05) {
                    food.push(new Food());
                }

                // Keep minimum food
                while (food.length < 20) {
                    food.push(new Food());
                }

                // Update creatures
                creatures = creatures.filter(c => c.update());

                // Repopulate if extinction
                if (creatures.length === 0) {
                    for (let i = 0; i < 10; i++) {
                        creatures.push(new Creature());
                    }
                }
            }

            // Draw
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#ffffff08';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            food.forEach(f => f.draw());
            creatures.forEach(c => c.draw());

            // Update stats
            document.getElementById('creatureCount').textContent = creatures.length;
            document.getElementById('foodCount').textContent = food.length;
            document.getElementById('generation').textContent = maxGeneration;
            document.getElementById('time').textContent = Math.floor(time);

            requestAnimationFrame(update);
        }

        init();
        update();
    </script>
</body>
</html>
