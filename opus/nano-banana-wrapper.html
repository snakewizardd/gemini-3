<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍌 Nano Banana Generator - Gemini Wrapper</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #0d0d0d;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ffd700;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .output {
            text-align: center;
        }
        .output img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
        .status.loading {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        .status.error {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
        }
        .status.success {
            background: rgba(0, 255, 0, 0.2);
            color: #69db7c;
        }
        .token-saved {
            color: #69db7c;
            font-size: 12px;
        }
        .clear-btn {
            background: #333;
            color: #fff;
            padding: 8px 15px;
            font-size: 12px;
            width: auto;
            display: inline-block;
            margin-top: 5px;
        }
        .response-text {
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍌 Nano Banana Generator</h1>
        <p class="subtitle">Elias's Gemini Image Wrapper POC</p>
        
        <div class="card">
            <label for="apiKey">🔑 Gemini API Key (stored locally in your browser)</label>
            <input type="password" id="apiKey" placeholder="Paste your Gemini API key here...">
            <span id="tokenStatus"></span>
            <button class="clear-btn" onclick="clearToken()">Clear Saved Token</button>
        </div>
        
        <div class="card">
            <label for="prompt">✏️ Prompt</label>
            <textarea id="prompt" placeholder="Describe what you want to generate...">A tiny nano-sized banana with cyberpunk aesthetic, glowing neon yellow, floating in space with tiny circuit patterns on its peel, 4k detailed render</textarea>
            
            <label for="model">🤖 Model</label>
            <select id="model" style="width:100%; padding:12px; background:#0d0d0d; color:#fff; border:2px solid #333; border-radius:8px; margin-bottom:15px;">
                <option value="gemini-2.0-flash-preview-image-generation">gemini-2.0-flash-preview-image-generation</option>
                <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp</option>
            </select>
            
            <button id="generateBtn" onclick="generateImage()">🎨 Generate Nano Banana</button>
        </div>
        
        <div id="statusArea"></div>
        
        <div class="card output" id="outputArea" style="display:none;">
            <h3>Generated Image:</h3>
            <img id="generatedImage" src="" alt="Generated image">
            <div id="responseText" class="response-text" style="display:none;"></div>
            <br><br>
            <button onclick="downloadImage()">💾 Download Image</button>
        </div>
    </div>

    <script>
        // Load saved API key on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                document.getElementById('tokenStatus').innerHTML = '<span class="token-saved">✓ Token loaded from local storage</span>';
            }
        });

        // Save API key when changed
        document.getElementById('apiKey').addEventListener('change', (e) => {
            if (e.target.value) {
                localStorage.setItem('gemini_api_key', e.target.value);
                document.getElementById('tokenStatus').innerHTML = '<span class="token-saved">✓ Token saved locally</span>';
            }
        });

        function clearToken() {
            localStorage.removeItem('gemini_api_key');
            document.getElementById('apiKey').value = '';
            document.getElementById('tokenStatus').innerHTML = '';
        }

        function setStatus(message, type) {
            const statusArea = document.getElementById('statusArea');
            statusArea.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function generateImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const model = document.getElementById('model').value;
            const btn = document.getElementById('generateBtn');

            if (!apiKey) {
                setStatus('❌ Please enter your Gemini API key!', 'error');
                return;
            }

            if (!prompt) {
                setStatus('❌ Please enter a prompt!', 'error');
                return;
            }

            // Save the key
            localStorage.setItem('gemini_api_key', apiKey);

            btn.disabled = true;
            btn.textContent = '⏳ Generating...';
            setStatus('🔄 Sending request to Gemini API... this may take a moment', 'loading');
            document.getElementById('outputArea').style.display = 'none';

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: prompt }]
                            }],
                            generationConfig: {
                                responseModalities: ["TEXT", "IMAGE"]
                            }
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API request failed');
                }

                // Parse response
                const parts = data.candidates?.[0]?.content?.parts;
                if (!parts) {
                    throw new Error('No content in response');
                }

                let imageData = null;
                let textResponse = '';

                for (const part of parts) {
                    if (part.inlineData) {
                        imageData = part.inlineData;
                    }
                    if (part.text) {
                        textResponse += part.text;
                    }
                }

                if (imageData) {
                    const imgSrc = `data:${imageData.mimeType || 'image/png'};base64,${imageData.data}`;
                    document.getElementById('generatedImage').src = imgSrc;
                    document.getElementById('outputArea').style.display = 'block';
                    setStatus('✅ Image generated successfully!', 'success');

                    if (textResponse) {
                        document.getElementById('responseText').style.display = 'block';
                        document.getElementById('responseText').textContent = textResponse;
                    } else {
                        document.getElementById('responseText').style.display = 'none';
                    }
                } else {
                    throw new Error('No image in response. Text response: ' + (textResponse || 'none'));
                }

            } catch (error) {
                console.error('Error:', error);
                setStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎨 Generate Nano Banana';
            }
        }

        function downloadImage() {
            const img = document.getElementById('generatedImage');
            const link = document.createElement('a');
            link.download = 'nano-banana-' + Date.now() + '.png';
            link.href = img.src;
            link.click();
        }
    </script>
</body>
</html>
