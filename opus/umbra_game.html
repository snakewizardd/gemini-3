<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT UMBRA - The Glass Tower</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            overflow: hidden;
        }
        #gameContainer { position: relative; }
        #gameCanvas { border: 2px solid #00ff88; background: #111; display: block; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        #ui div { background: rgba(0,0,0,0.8); padding: 5px 10px; margin-bottom: 5px; border-left: 3px solid #00ff88; }
        #alertBar { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-left: 3px solid #238636; }
        #objective { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; max-width: 300px; border-left: 3px solid #ff3366; }
        #controls { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; font-size: 12px; text-align: right; }
        #inventory { position: absolute; top: 100px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-left: 3px solid #8957e5; font-size: 12px; }
        #inventory h4 { color: #8957e5; margin-bottom: 5px; }
        .item { color: #00ff88; padding: 2px 0; }
        #interactPrompt { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 10px 20px; border: 1px solid #00ff88; display: none; }
        #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 30px 50px; border: 2px solid #00ff88; text-align: center; z-index: 100; }
        #message h2 { margin-bottom: 15px; font-size: 24px; }
        #message p { color: #8b949e; margin-bottom: 10px; white-space: pre-line; }
        #message button { background: #00ff88; color: #000; border: none; padding: 10px 30px; margin-top: 15px; cursor: pointer; font-family: inherit; font-weight: bold; }
        #message button:hover { background: #00cc6a; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <div id="floor">FLOOR: 1 - EXPO HALL</div>
            <div id="disguise">DISGUISE: NONE</div>
            <div id="detection">DETECTION: 0%</div>
        </div>
        <div id="alertBar">STATUS: UNDETECTED</div>
        <div id="objective"><strong style="color:#ff3366">OBJECTIVE:</strong><br>Eliminate Marcus Chen in Suite 4701.</div>
        <div id="inventory"><h4>INVENTORY</h4><div id="inventoryList"><div style="color:#666">Empty</div></div></div>
        <div id="controls"><strong>CONTROLS</strong><br>WASD - Move<br>E - Interact/Takedown<br>Q - Use Poison<br>SPACE - Hide</div>
        <div id="interactPrompt">[E] to interact</div>
        <div id="message"><h2 id="msgTitle">PROJECT UMBRA</h2><p id="msgText">Loading...</p><button onclick="startGame()">START MISSION</button></div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameStarted = false;
let gamePaused = true;
let currentFloor = 1;
let alertLevel = 0;
let targetDead = false;

const player = {
    x: 100, y: 300, size: 20, speed: 3,
    disguise: null, hiding: false, inventory: []
};

const keys = {};

const floors = {
    1: {
        name: "EXPO HALL",
        color: '#1a1a2e',
        walls: [
            {x:0,y:0,w:900,h:20},{x:0,y:580,w:900,h:20},{x:0,y:0,w:20,h:600},{x:880,y:0,w:20,h:600},
            {x:200,y:0,w:20,h:200},{x:200,y:200,w:150,h:20},
            {x:500,y:0,w:20,h:150},{x:500,y:150,w:200,h:20},
            {x:0,y:400,w:300,h:20},{x:300,y:300,w:20,h:120},
            {x:600,y:400,w:20,h:200},{x:600,y:400,w:280,h:20}
        ],
        items: [
            {x:250,y:100,type:'uniform',name:'Waiter Uniform',taken:false},
            {x:750,y:500,type:'keycard',name:'Staff Keycard',taken:false}
        ],
        guards: [
            {x:400,y:200,patrolX:[400,600],patrolY:[200,350],px:0,py:0,dx:1,dy:0,speed:1.5,vision:80,angle:0,ko:false},
            {x:150,y:480,patrolX:[150,250],patrolY:[450,500],px:0,py:0,dx:1,dy:0,speed:1,vision:70,angle:0,ko:false}
        ],
        hiding: [{x:50,y:100,w:40,h:60},{x:750,y:50,w:40,h:60},{x:350,y:450,w:60,h:40}],
        elevators: [{x:830,y:280,w:50,h:60,to:2,need:null}],
        target: null
    },
    2: {
        name: "HOTEL FLOOR",
        color: '#16213e',
        walls: [
            {x:0,y:0,w:900,h:20},{x:0,y:580,w:900,h:20},{x:0,y:0,w:20,h:600},{x:880,y:0,w:20,h:600},
            {x:0,y:150,w:700,h:20},{x:0,y:450,w:700,h:20},
            {x:150,y:0,w:20,h:150},{x:300,y:0,w:20,h:150},{x:450,y:0,w:20,h:150},{x:600,y:0,w:20,h:150},
            {x:150,y:450,w:20,h:150},{x:300,y:450,w:20,h:150},{x:450,y:450,w:20,h:150},{x:600,y:450,w:20,h:150},
            {x:700,y:150,w:20,h:150},{x:700,y:350,w:20,h:100}
        ],
        items: [
            {x:100,y:70,type:'poison',name:'Poison Vial',taken:false},
            {x:400,y:520,type:'vipcard',name:'VIP Keycard',taken:false}
        ],
        guards: [
            {x:350,y:300,patrolX:[100,600],patrolY:[300,300],px:0,py:0,dx:1,dy:0,speed:1.2,vision:100,angle:0,ko:false},
            {x:750,y:300,patrolX:[750,750],patrolY:[200,400],px:0,py:0,dx:0,dy:1,speed:1,vision:90,angle:0,ko:false}
        ],
        hiding: [{x:220,y:50,w:60,h:40},{x:370,y:500,w:60,h:40},{x:800,y:500,w:40,h:60}],
        elevators: [{x:830,y:280,w:50,h:60,to:3,need:'vipcard'},{x:20,y:280,w:50,h:60,to:1,need:null}],
        target: null
    },
    3: {
        name: "PENTHOUSE - TARGET",
        color: '#0f0f23',
        walls: [
            {x:0,y:0,w:900,h:20},{x:0,y:580,w:900,h:20},{x:0,y:0,w:20,h:600},{x:880,y:0,w:20,h:600},
            {x:400,y:150,w:20,h:300},{x:400,y:150,w:300,h:20},{x:400,y:430,w:300,h:20},
            {x:700,y:150,w:20,h:130},{x:700,y:350,w:20,h:100},
            {x:0,y:200,w:200,h:20},{x:200,y:200,w:20,h:200},{x:0,y:400,w:220,h:20}
        ],
        items: [
            {x:100,y:300,type:'gun',name:'Silenced Pistol',taken:false}
        ],
        guards: [
            {x:300,y:300,patrolX:[200,350],patrolY:[150,400],px:0,py:0,dx:1,dy:0,speed:1.3,vision:100,angle:0,ko:false},
            {x:550,y:290,patrolX:[480,620],patrolY:[290,290],px:0,py:0,dx:1,dy:0,speed:0.8,vision:90,angle:0,ko:false}
        ],
        hiding: [{x:50,y:250,w:40,h:80},{x:750,y:50,w:60,h:40},{x:500,y:500,w:60,h:40}],
        elevators: [{x:20,y:280,w:50,h:60,to:2,need:null}],
        target: {x:580,y:380,alive:true}
    }
};

document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(e.key === ' ') e.preventDefault();
    if(!gameStarted || gamePaused) return;
    if(e.key.toLowerCase() === 'e') interact();
    if(e.key.toLowerCase() === 'q') usePoison();
    if(e.key === ' ') tryHide();
});

document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function dist(a,b){ return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }

function rectHit(p,r){ return p.x < r.x+r.w && p.x+p.size > r.x && p.y < r.y+r.h && p.y+p.size > r.y; }

function hasItem(type){ return player.inventory.some(i => i.type === type); }

function showMsg(title, text){
    document.getElementById('msgTitle').textContent = title;
    document.getElementById('msgText').textContent = text;
    document.getElementById('message').style.display = 'block';
    gamePaused = true;
}

function startGame(){
    document.getElementById('message').style.display = 'none';
    gameStarted = true;
    gamePaused = false;
}

function goFloor(f){
    currentFloor = f;
    player.x = 100;
    player.y = 300;
    player.hiding = false;
    floors[f].guards.forEach(g => {
        g.x = g.patrolX[0];
        g.y = g.patrolY[0];
        g.ko = false;
    });
}

function interact(){
    const fl = floors[currentFloor];
    
    // Items
    fl.items.forEach(item => {
        if(!item.taken && dist(player, item) < 40){
            item.taken = true;
            player.inventory.push(item);
            if(item.type === 'uniform') player.disguise = 'waiter';
            showMsg('ACQUIRED', item.name);
        }
    });
    
    // Elevators
    fl.elevators.forEach(e => {
        if(rectHit(player, e)){
            if(e.need && !hasItem(e.need)){
                showMsg('LOCKED', 'Need: ' + e.need.toUpperCase());
            } else {
                goFloor(e.to);
            }
        }
    });
    
    // Guard takedown
    fl.guards.forEach(g => {
        if(!g.ko && dist(player, g) < 35){
            g.ko = true;
            showMsg('TAKEDOWN', 'Guard neutralized');
        }
    });
    
    // Target kill
    if(fl.target && fl.target.alive && dist(player, fl.target) < 40){
        fl.target.alive = false;
        targetDead = true;
        if(hasItem('gun')){
            showMsg('ELIMINATED', 'Clean kill. Escape to Floor 1 elevator!');
        } else {
            alertLevel = 60;
            showMsg('ELIMINATED', 'Messy kill - guards alerted! Escape NOW!');
        }
    }
}

function usePoison(){
    const fl = floors[currentFloor];
    if(hasItem('poison') && fl.target && fl.target.alive && dist(player, fl.target) < 80){
        fl.target.alive = false;
        targetDead = true;
        player.inventory = player.inventory.filter(i => i.type !== 'poison');
        showMsg('POISONED', 'Target eliminated silently. Escape to Floor 1!');
    }
}

function tryHide(){
    const fl = floors[currentFloor];
    const spot = fl.hiding.find(h => rectHit(player, h));
    if(spot) player.hiding = !player.hiding;
}

function update(){
    if(!gameStarted || gamePaused) return;
    
    const fl = floors[currentFloor];
    
    // Movement
    if(!player.hiding){
        let nx = player.x, ny = player.y;
        if(keys['w']||keys['arrowup']) ny -= player.speed;
        if(keys['s']||keys['arrowdown']) ny += player.speed;
        if(keys['a']||keys['arrowleft']) nx -= player.speed;
        if(keys['d']||keys['arrowright']) nx += player.speed;
        
        let canX = true, canY = true;
        fl.walls.forEach(w => {
            if(nx > w.x-player.size && nx < w.x+w.w && player.y > w.y-player.size && player.y < w.y+w.h) canX = false;
            if(player.x > w.x-player.size && player.x < w.x+w.w && ny > w.y-player.size && ny < w.y+w.h) canY = false;
        });
        
        if(canX) player.x = Math.max(25, Math.min(855, nx));
        if(canY) player.y = Math.max(25, Math.min(555, ny));
    }
    
    // Guards
    fl.guards.forEach(g => {
        if(g.ko) return;
        
        // Patrol
        const tx = g.patrolX[g.px];
        const ty = g.patrolY[g.py];
        const dx = tx - g.x;
        const dy = ty - g.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        
        if(d > 3){
            g.x += (dx/d) * g.speed;
            g.y += (dy/d) * g.speed;
            g.angle = Math.atan2(dy, dx);
        } else {
            if(g.dx !== 0) g.px = (g.px + 1) % g.patrolX.length;
            if(g.dy !== 0) g.py = (g.py + 1) % g.patrolY.length;
            g.dx = g.dx || 1;
            g.dy = g.dy || 1;
        }
        
        // Detection
        if(!player.hiding){
            const pd = dist(player, g);
            if(pd < g.vision){
                let detected = true;
                if(player.disguise === 'waiter' && currentFloor < 3 && pd > 30) detected = false;
                if(detected){
                    alertLevel = Math.min(100, alertLevel + 0.8);
                    if(alertLevel >= 100){
                        showMsg('MISSION FAILED', 'You were caught!');
                    }
                }
            }
        }
    });
    
    // Alert decay
    if(alertLevel > 0) alertLevel = Math.max(0, alertLevel - (player.hiding ? 0.5 : 0.15));
    
    // Win check
    if(targetDead && currentFloor === 1){
        const ex = fl.elevators[0];
        if(rectHit(player, ex)){
            const rating = alertLevel < 15 ? 'SILENT ASSASSIN' : alertLevel < 40 ? 'PROFESSIONAL' : 'SLOPPY';
            showMsg('MISSION COMPLETE', 'Rating: ' + rating);
        }
    }
    
    // Interact prompt
    let prompt = false;
    fl.items.forEach(i => { if(!i.taken && dist(player,i) < 40) prompt = true; });
    fl.elevators.forEach(e => { if(rectHit(player,e)) prompt = true; });
    fl.guards.forEach(g => { if(!g.ko && dist(player,g) < 35) prompt = true; });
    if(fl.target && fl.target.alive && dist(player, fl.target) < 50) prompt = true;
    document.getElementById('interactPrompt').style.display = prompt ? 'block' : 'none';
}

function render(){
    const fl = floors[currentFloor];
    
    ctx.fillStyle = fl.color;
    ctx.fillRect(0, 0, 900, 600);
    
    // Hiding spots
    ctx.fillStyle = 'rgba(0,100,50,0.3)';
    fl.hiding.forEach(h => {
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.strokeStyle = '#00ff88';
        ctx.strokeRect(h.x, h.y, h.w, h.h);
    });
    
    // Walls
    ctx.fillStyle = '#333';
    fl.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
    
    // Elevators
    fl.elevators.forEach(e => {
        ctx.fillStyle = '#4a4a6a';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#0f0';
        ctx.font = '10px monospace';
        ctx.fillText('ELEV', e.x+8, e.y+35);
    });
    
    // Items
    fl.items.forEach(item => {
        if(item.taken) return;
        ctx.fillStyle = item.type==='keycard'||item.type==='vipcard' ? '#ffd700' : item.type==='poison' ? '#ff00ff' : item.type==='gun' ? '#ff3366' : '#0ff';
        ctx.beginPath();
        ctx.arc(item.x, item.y, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(item.x, item.y, 15 + Math.sin(Date.now()/200)*3, 0, Math.PI*2);
        ctx.stroke();
    });
    
    // Guards
    fl.guards.forEach(g => {
        if(g.ko){
            ctx.fillStyle = '#333';
            ctx.fillRect(g.x-12, g.y-6, 24, 12);
            return;
        }
        ctx.fillStyle = 'rgba(255,100,100,0.15)';
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.arc(g.x, g.y, g.vision, g.angle-0.6, g.angle+0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.arc(g.x, g.y, 14, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x + Math.cos(g.angle)*18, g.y + Math.sin(g.angle)*18);
        ctx.stroke();
    });
    
    // Target
    if(fl.target){
        if(fl.target.alive){
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.arc(fl.target.x, fl.target.y, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#f00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(fl.target.x, fl.target.y, 25 + Math.sin(Date.now()/150)*5, 0, Math.PI*2);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px monospace';
            ctx.fillText('TARGET', fl.target.x-24, fl.target.y-30);
        } else {
            ctx.fillStyle = '#400';
            ctx.fillRect(fl.target.x-12, fl.target.y-6, 24, 12);
        }
    }
    
    // Player
    if(player.hiding){
        ctx.strokeStyle = 'rgba(0,255,136,0.5)';
        ctx.setLineDash([5,5]);
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size/2, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);
    } else {
        ctx.fillStyle = player.disguise ? '#0af' : '#0f8';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size/2, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size/2+4, 0, Math.PI*2);
        ctx.stroke();
    }
    
    // UI updates
    document.getElementById('floor').textContent = 'FLOOR: ' + currentFloor + ' - ' + fl.name;
    document.getElementById('disguise').textContent = 'DISGUISE: ' + (player.disguise ? player.disguise.toUpperCase() : 'NONE');
    document.getElementById('detection').textContent = 'DETECTION: ' + Math.round(alertLevel) + '%';
    document.getElementById('detection').style.color = alertLevel > 70 ? '#f33' : alertLevel > 30 ? '#fd0' : '#0f8';
    document.getElementById('alertBar').textContent = alertLevel > 70 ? 'STATUS: DANGER!' : alertLevel > 30 ? 'STATUS: SUSPICIOUS' : 'STATUS: UNDETECTED';
    document.getElementById('alertBar').style.borderColor = alertLevel > 70 ? '#f33' : alertLevel > 30 ? '#fd0' : '#238636';
    document.getElementById('inventoryList').innerHTML = player.inventory.length ? player.inventory.map(i => '<div class="item">• '+i.name+'</div>').join('') : '<div style="color:#666">Empty</div>';
    
    let obj = 'Find keycards, reach Floor 3, eliminate Marcus Chen.';
    if(currentFloor === 3 && !targetDead) obj = 'TARGET LOCATED! Press E near target or Q with poison.';
    if(targetDead) obj = 'TARGET DOWN! Return to Floor 1 elevator to escape!';
    document.getElementById('objective').innerHTML = '<strong style="color:#ff3366">OBJECTIVE:</strong><br>' + obj;
}

function gameLoop(){
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Init message
document.getElementById('msgTitle').textContent = 'PROJECT UMBRA';
document.getElementById('msgText').textContent = 'Target: Marcus Chen - Floor 3\n\nWASD = Move | E = Interact/Takedown\nQ = Use Poison | SPACE = Hide\n\nCollect items, avoid guards, eliminate target, escape!';
gameLoop();
</script>
</body>
</html>
