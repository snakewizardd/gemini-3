<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pluribus — Episode V</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@200;300;400&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0a0b;
            --bg-subtle: #111113;
            --accent-warm: #c9a55c;
            --accent-glow: #e8c677;
            --text-muted: #5a5a5f;
            --text-dim: #3a3a3f;
            --border-subtle: rgba(201, 165, 92, 0.15);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-deep);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Ambient background texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse 120% 100% at 50% 0%, rgba(201, 165, 92, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse 80% 50% at 50% 100%, rgba(201, 165, 92, 0.02) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-warm);
            border-radius: 50%;
            opacity: 0;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                opacity: 0;
                transform: translateY(100vh) scale(0.5);
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        /* Title section */
        .title-section {
            text-align: center;
            margin-bottom: 2.5rem;
            z-index: 10;
            position: relative;
        }

        .series-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--accent-warm);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 60px rgba(201, 165, 92, 0.3);
            animation: titleReveal 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                letter-spacing: 0.8em;
            }

            100% {
                opacity: 1;
                letter-spacing: 0.4em;
            }
        }

        .episode-marker {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            animation: fadeIn 2s ease-out 0.5s forwards;
            opacity: 0;
        }

        .episode-marker::before,
        .episode-marker::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-warm), transparent);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Theater container */
        .theater {
            position: relative;
            z-index: 10;
            animation: theaterReveal 1.5s ease-out 0.3s forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes theaterReveal {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Frame styling */
        .screen-frame {
            position: relative;
            background: linear-gradient(135deg, #1a1a1d 0%, #0d0d0e 100%);
            padding: 3px;
            border-radius: 8px;
            box-shadow:
                0 0 0 1px var(--border-subtle),
                0 25px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 100px -30px rgba(201, 165, 92, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .screen-frame::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(201, 165, 92, 0.5),
                    transparent);
        }

        .screen-inner {
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        /* Vignette overlay */
        .screen-inner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            border-radius: 6px;
        }

        iframe {
            display: block;
            border: none;
        }

        /* Bottom accent */
        .bottom-accent {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 10;
            animation: fadeIn 2s ease-out 1s forwards;
            opacity: 0;
        }

        .accent-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-warm);
            opacity: 0.6;
            animation: pulse 3s ease-in-out infinite;
        }

        .accent-dot:nth-child(2) {
            animation-delay: 1s;
        }

        .accent-dot:nth-child(3) {
            animation-delay: 2s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .series-title {
                font-size: 2.5rem;
            }

            iframe {
                width: 90vw;
                height: 50.625vw;
            }
        }

        @media (max-width: 600px) {
            .series-title {
                font-size: 1.8rem;
                letter-spacing: 0.2em;
            }

            .title-section {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Title -->
    <div class="title-section">
        <h1 class="series-title">Pluribus</h1>
        <div class="episode-marker">Episode Five</div>
    </div>

    <!-- Theater screen -->
    <div class="theater">
        <div class="screen-frame">
            <div class="screen-inner">
                <iframe src="https://vidsrc.to/embed/tv/225171/1/7" width="960" height="540" allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <!-- Bottom accent -->
    <div class="bottom-accent">
        <div class="accent-dot"></div>
        <div class="accent-dot"></div>
        <div class="accent-dot"></div>
    </div>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 15}s`;
            particle.style.animationDuration = `${12 + Math.random() * 8}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>

</html>
