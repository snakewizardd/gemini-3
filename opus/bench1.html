<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D to 3D Shape Extruder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        h1 { margin-bottom: 10px; font-weight: 300; }
        .info { margin-bottom: 20px; opacity: 0.7; font-size: 14px; }
        canvas {
            background: #0d1117;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .stats {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <h1>3D Shape Extruder</h1>
    <div class="info">Draw a closed shape (fast = deep extrusion) | After drawing, drag to rotate</div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="stats" id="stats">Draw something!</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');

        // State
        let mode = 'draw'; // 'draw' or 'rotate'
        let points = [];
        let timestamps = [];
        let shape3D = null;
        let rotX = 0.4, rotY = 0.3;
        let lastMouse = { x: 0, y: 0 };
        let isDragging = false;

        // Light source
        const light = { x: 0.5, y: -0.8, z: 0.6 };
        const lightLen = Math.sqrt(light.x*light.x + light.y*light.y + light.z*light.z);
        light.x /= lightLen; light.y /= lightLen; light.z /= lightLen;

        // Normalize vector
        function normalize(v) {
            const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
            if (len === 0) return { x: 0, y: 0, z: 1 };
            return { x: v.x/len, y: v.y/len, z: v.z/len };
        }

        // Cross product
        function cross(a, b) {
            return {
                x: a.y * b.z - a.z * b.y,
                y: a.z * b.x - a.x * b.z,
                z: a.x * b.y - a.y * b.x
            };
        }

        // Subtract vectors
        function sub(a, b) {
            return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
        }

        // Dot product
        function dot(a, b) {
            return a.x * b.x + a.y * b.y + a.z * b.z;
        }

        // Rotate point around X axis
        function rotateX(p, angle) {
            const cos = Math.cos(angle), sin = Math.sin(angle);
            return {
                x: p.x,
                y: p.y * cos - p.z * sin,
                z: p.y * sin + p.z * cos
            };
        }

        // Rotate point around Y axis
        function rotateY(p, angle) {
            const cos = Math.cos(angle), sin = Math.sin(angle);
            return {
                x: p.x * cos + p.z * sin,
                y: p.y,
                z: -p.x * sin + p.z * cos
            };
        }

        // Calculate average drawing speed and return extrusion depth
        function calculateDepth() {
            if (timestamps.length < 2) return 50;
            let totalDist = 0;
            let totalTime = timestamps[timestamps.length-1] - timestamps[0];
            
            for (let i = 1; i < points.length; i++) {
                const dx = points[i].x - points[i-1].x;
                const dy = points[i].y - points[i-1].y;
                totalDist += Math.sqrt(dx*dx + dy*dy);
            }
            
            const speed = totalDist / (totalTime || 1);
            // Map speed to depth: faster = deeper
            const depth = Math.min(200, Math.max(30, speed * 80));
            return depth;
        }

        // Create 3D mesh from 2D points
        function createMesh(pts, depth) {
            // Center the shape
            let cx = 0, cy = 0;
            pts.forEach(p => { cx += p.x; cy += p.y; });
            cx /= pts.length; cy /= pts.length;
            
            const centered = pts.map(p => ({
                x: p.x - cx,
                y: p.y - cy
            }));

            // Create front and back faces (z positions)
            const frontZ = depth / 2;
            const backZ = -depth / 2;

            const frontVerts = centered.map(p => ({ x: p.x, y: p.y, z: frontZ }));
            const backVerts = centered.map(p => ({ x: p.x, y: p.y, z: backZ }));

            const faces = [];
            const n = centered.length;

            // Front face (as triangle fan)
            const frontCenter = { x: 0, y: 0, z: frontZ };
            for (let i = 0; i < n; i++) {
                faces.push({
                    verts: [frontCenter, frontVerts[i], frontVerts[(i+1)%n]],
                    color: { r: 100, g: 150, b: 255 },
                    type: 'front'
                });
            }

            // Back face (reversed winding)
            const backCenter = { x: 0, y: 0, z: backZ };
            for (let i = 0; i < n; i++) {
                faces.push({
                    verts: [backCenter, backVerts[(i+1)%n], backVerts[i]],
                    color: { r: 100, g: 150, b: 255 },
                    type: 'back'
                });
            }

            // Side faces (quads split into triangles)
            for (let i = 0; i < n; i++) {
                const i2 = (i + 1) % n;
                // Quad: frontVerts[i], frontVerts[i2], backVerts[i2], backVerts[i]
                faces.push({
                    verts: [frontVerts[i], frontVerts[i2], backVerts[i2]],
                    color: { r: 80, g: 130, b: 220 },
                    type: 'side'
                });
                faces.push({
                    verts: [frontVerts[i], backVerts[i2], backVerts[i]],
                    color: { r: 80, g: 130, b: 220 },
                    type: 'side'
                });
            }

            return { faces, center: { x: cx, y: cy }, depth };
        }

        // Calculate face normal
        function getFaceNormal(verts) {
            const v1 = sub(verts[1], verts[0]);
            const v2 = sub(verts[2], verts[0]);
            return normalize(cross(v1, v2));
        }

        // Project 3D to 2D
        function project(p) {
            const scale = 600 / (600 + p.z);
            return {
                x: canvas.width/2 + p.x * scale,
                y: canvas.height/2 + p.y * scale,
                z: p.z,
                scale: scale
            };
        }

        // Render the 3D shape
        function render() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (mode === 'draw') {
                // Draw current stroke
                if (points.length > 1) {
                    ctx.strokeStyle = '#4fc3f7';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(points[i].x, points[i].y);
                    }
                    ctx.stroke();

                    // Draw points
                    ctx.fillStyle = '#fff';
                    points.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            } else if (shape3D) {
                // Transform and render 3D
                const transformed = shape3D.faces.map(face => {
                    const rotatedVerts = face.verts.map(v => {
                        let p = rotateX(v, rotX);
                        p = rotateY(p, rotY);
                        return p;
                    });
                    
                    const normal = getFaceNormal(rotatedVerts);
                    const projected = rotatedVerts.map(project);
                    const avgZ = rotatedVerts.reduce((s, v) => s + v.z, 0) / 3;

                    return {
                        projected,
                        normal,
                        avgZ,
                        color: face.color,
                        type: face.type
                    };
                });

                // Sort by Z (painter's algorithm)
                transformed.sort((a, b) => a.avgZ - b.avgZ);

                // Draw shadow on ground plane
                ctx.save();
                ctx.globalAlpha = 0.3;
                transformed.forEach(face => {
                    if (face.normal.z < 0) return; // backface
                    const shadowOffset = 80;
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    face.projected.forEach((p, i) => {
                        const sx = p.x + shadowOffset * 0.5;
                        const sy = p.y + shadowOffset;
                        if (i === 0) ctx.moveTo(sx, sy);
                        else ctx.lineTo(sx, sy);
                    });
                    ctx.closePath();
                    ctx.fill();
                });
                ctx.restore();

                // Draw faces
                transformed.forEach(face => {
                    // Backface culling
                    if (face.normal.z < 0) return;

                    // Lighting calculation
                    const lightIntensity = Math.max(0, dot(face.normal, light));
                    const ambient = 0.25;
                    const diffuse = lightIntensity * 0.65;
                    const specular = Math.pow(Math.max(0, lightIntensity), 32) * 0.4;
                    
                    const brightness = ambient + diffuse;
                    const r = Math.min(255, Math.floor(face.color.r * brightness + 255 * specular));
                    const g = Math.min(255, Math.floor(face.color.g * brightness + 255 * specular));
                    const b = Math.min(255, Math.floor(face.color.b * brightness + 255 * specular));

                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.strokeStyle = `rgba(255,255,255,0.15)`;
                    ctx.lineWidth = 1;

                    ctx.beginPath();
                    face.projected.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                });

                // Draw edges for definition
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                transformed.forEach(face => {
                    if (face.normal.z < 0) return;
                    ctx.beginPath();
                    face.projected.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                    ctx.closePath();
                    ctx.stroke();
                });
            }

            requestAnimationFrame(render);
        }

        // Simplify points to reduce complexity
        function simplifyPoints(pts, tolerance = 5) {
            if (pts.length < 3) return pts;
            const result = [pts[0]];
            for (let i = 1; i < pts.length; i++) {
                const last = result[result.length - 1];
                const dx = pts[i].x - last.x;
                const dy = pts[i].y - last.y;
                if (dx*dx + dy*dy > tolerance*tolerance) {
                    result.push(pts[i]);
                }
            }
            return result;
        }

        // Mouse handlers
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (mode === 'draw') {
                points = [{ x, y }];
                timestamps = [performance.now()];
                isDragging = true;
            } else {
                isDragging = true;
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (mode === 'draw') {
                points.push({ x, y });
                timestamps.push(performance.now());
            } else {
                const dx = e.clientX - lastMouse.x;
                const dy = e.clientY - lastMouse.y;
                rotY += dx * 0.01;
                rotX += dy * 0.01;
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (mode === 'draw' && points.length > 10) {
                const simplified = simplifyPoints(points, 8);
                const depth = calculateDepth();
                shape3D = createMesh(simplified, depth);
                mode = 'rotate';
                stats.textContent = `Shape created! Depth: ${depth.toFixed(0)}px | Vertices: ${simplified.length} | Drag to rotate | Double-click to draw again`;
            }
            isDragging = false;
        });

        canvas.addEventListener('dblclick', () => {
            mode = 'draw';
            shape3D = null;
            points = [];
            timestamps = [];
            rotX = 0.4;
            rotY = 0.3;
            stats.textContent = 'Draw something!';
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            canvas.dispatchEvent(new MouseEvent('mouseup'));
        });

        // Start rendering
        render();
    </script>
</body>
</html>
