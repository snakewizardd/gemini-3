
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pulse | Confluence</title>
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: rgba(255,255,255,0.8);
      overflow: hidden;
    }
    
    h1 {
      font-weight: 300;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.7);
    }
    
    .subtitle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 2rem;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }
    
    canvas {
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }
    
    button {
      padding: 12px 32px;
      font-family: inherit;
      font-size: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }
    
    .metrics {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
      text-align: center;
    }
    
    .metric-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .metric-value {
      font-size: 1.1rem;
      margin-top: 0.3rem;
      color: rgba(255,255,255,0.6);
    }
    
    .harmony-display {
      position: absolute;
      font-size: 0.8rem;
      color: rgba(255,220,150,0.9);
    }
  </style>
</head>
<body>
  <h1>THE PULSE</h1>
  <p class="subtitle">
    Growth and flow, visualized and sonified.<br>
    A self-contained meditation on data becoming experience.
  </p>
  
  <canvas id="canvas" width="900" height="450"></canvas>
  
  <div class="controls">
    <button id="playBtn">▶ Listen</button>
    <button id="regenBtn">↻ Regenerate</button>
  </div>
  
  <div class="metrics">
    <div>
      <div class="metric-label">coherence</div>
      <div class="metric-value" id="coherence">--</div>
    </div>
    <div>
      <div class="metric-label">balance</div>
      <div class="metric-value" id="balance">--</div>
    </div>
    <div>
      <div class="metric-label">momentum</div>
      <div class="metric-value" id="momentum">--</div>
    </div>
    <div>
      <div class="metric-label">volatility</div>
      <div class="metric-value" id="volatility">--</div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════════════
// THE PULSE - A meditation on data, sound, and unity
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ─── DATA GENERATION ────────────────────────────────────────────────

function generateGrowth(n = 100, noise = 0.08) {
  const data = [];
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const sigmoid = 1 / (1 + Math.exp(-12 * (t - 0.5)));
    const noiseFactor = Math.sin(t * 13.7) * 0.3 + Math.sin(t * 31.4) * 0.2 + Math.sin(t * 67.1) * 0.1;
    data.push(Math.max(0, Math.min(1, sigmoid + noiseFactor * noise)));
  }
  return data;
}

function generateFlow(n = 100, freq = 3, drift = 0.15) {
  const data = [];
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const wave = Math.sin(t * Math.PI * 2 * freq);
    const d = Math.sin(t * Math.PI * 0.5) * drift;
    data.push(Math.max(0, Math.min(1, (wave + 1) / 2 + d)));
  }
  return data;
}

// ─── HARMONY CALCULATION ────────────────────────────────────────────

function calculateHarmony(growth, flow) {
  const all = [...growth, ...flow];
  const n = all.length;
  
  // Balance: how centered around 0.5?
  const mean = all.reduce((a, b) => a + b, 0) / n;
  const balance = 1 - Math.abs(mean - 0.5) * 2;
  
  // Volatility
  const variance = all.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / n;
  const volatility = Math.min(1, Math.sqrt(variance) * 2);
  
  // Momentum
  const third = Math.floor(growth.length / 3);
  const firstMean = growth.slice(0, third).reduce((a, b) => a + b, 0) / third;
  const lastMean = growth.slice(-third).reduce((a, b) => a + b, 0) / third;
  const momentum = lastMean - firstMean;
  
  // Coherence (correlation between growth and flow)
  let dot = 0, norm1 = 0, norm2 = 0;
  const len = Math.min(growth.length, flow.length);
  for (let i = 0; i < len; i++) {
    dot += growth[i] * flow[i];
    norm1 += growth[i] * growth[i];
    norm2 += flow[i] * flow[i];
  }
  const coherence = (dot / (Math.sqrt(norm1) * Math.sqrt(norm2) + 0.0001) + 1) / 2;
  
  // Overall harmony
  const overall = balance * 0.3 + coherence * 0.3 + (1 - volatility) * 0.2 + (1 - Math.abs(momentum)) * 0.2;
  
  return { overall, coherence, balance, momentum, volatility };
}

// ─── VISUALIZATION ──────────────────────────────────────────────────

let animationId = null;
let phase = 0;

function draw(growth, flow, harmony) {
  phase += 0.005;
  
  // Background
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#0d1117');
  grad.addColorStop(0.5, '#161b22');
  grad.addColorStop(1, '#0d1117');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 50) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  
  // Flow (water - blue, lower)
  ctx.beginPath();
  ctx.strokeStyle = `rgba(100, 180, 255, ${0.4 + harmony.coherence * 0.3})`;
  ctx.lineWidth = 2;
  flow.forEach((v, i) => {
    const x = (i / flow.length) * W;
    const y = H - v * H * 0.35 - H * 0.08 + Math.sin(phase + i * 0.1) * 3;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Flow fill
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = 'rgba(100, 180, 255, 0.05)';
  ctx.fill();
  
  // Growth (earth - green, rising)
  ctx.beginPath();
  ctx.strokeStyle = `rgba(120, 200, 120, ${0.5 + harmony.balance * 0.4})`;
  ctx.lineWidth = 3;
  growth.forEach((v, i) => {
    const x = (i / growth.length) * W;
    const y = H - v * H * 0.6 - H * 0.15;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Harmony orb (center)
  const cx = W / 2;
  const cy = H / 2;
  const radius = 30 + harmony.overall * 50 + Math.sin(phase * 2) * 5;
  
  // Glow
  const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2);
  glowGrad.addColorStop(0, `rgba(255, 220, 150, ${0.15 + harmony.overall * 0.15})`);
  glowGrad.addColorStop(1, 'rgba(255, 220, 150, 0)');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(cx - radius * 2, cy - radius * 2, radius * 4, radius * 4);
  
  // Orb
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255, 220, 150, ${0.1 + harmony.overall * 0.2})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(255, 220, 150, ${0.3 + harmony.overall * 0.3})`;
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Harmony text
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.font = '14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`harmony: ${(harmony.overall * 100).toFixed(1)}%`, cx, cy + 5);
  
  animationId = requestAnimationFrame(() => draw(growth, flow, harmony));
}

// ─── SONIFICATION ───────────────────────────────────────────────────

const SCALE = [0, 2, 4, 7, 9]; // Pentatonic - always peaceful
let synth = null;
let sequence = null;
let isPlaying = false;

function valueToNote(v) {
  const baseOctave = 3;
  const idx = Math.floor(v * SCALE.length);
  const octaveOffset = Math.floor(v * 2);
  const semitone = SCALE[Math.min(idx, SCALE.length - 1)];
  const midi = (baseOctave + octaveOffset) * 12 + semitone;
  return Tone.Frequency(midi, 'midi').toNote();
}

async function startSound(growth, flow, harmony) {
  await Tone.start();
  
  synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sine' },
    envelope: { attack: 0.1, decay: 0.3, sustain: 0.4, release: 1.5 }
  }).toDestination();
  
  synth.volume.value = -12;
  
  // Tempo based on harmony (slower = more harmonious)
  const bpm = 60 + (1 - harmony.overall) * 50;
  Tone.getTransport().bpm.value = bpm;
  
  let idx = 0;
  sequence = new Tone.Sequence((time, _) => {
    if (idx < growth.length) {
      const note = valueToNote(growth[idx]);
      const duration = 0.1 + flow[idx % flow.length] * 0.3;
      synth.triggerAttackRelease(note, duration, time);
      idx = (idx + 1) % growth.length;
    }
  }, growth.map((_, i) => i), '8n');
  
  sequence.loop = true;
  sequence.start(0);
  Tone.getTransport().start();
  isPlaying = true;
}

function stopSound() {
  if (sequence) {
    sequence.stop();
    sequence.dispose();
    sequence = null;
  }
  if (synth) {
    synth.dispose();
    synth = null;
  }
  Tone.getTransport().stop();
  isPlaying = false;
}

// ─── STATE & UI ─────────────────────────────────────────────────────

let growth = [];
let flow = [];
let harmony = {};

function regenerate() {
  growth = generateGrowth(100, 0.05 + Math.random() * 0.1);
  flow = generateFlow(100, 2 + Math.random() * 3, 0.1 + Math.random() * 0.15);
  harmony = calculateHarmony(growth, flow);
  
  // Update metrics
  document.getElementById('coherence').textContent = (harmony.coherence * 100).toFixed(0) + '%';
  document.getElementById('balance').textContent = (harmony.balance * 100).toFixed(0) + '%';
  document.getElementById('momentum').textContent = (harmony.momentum > 0 ? '↑ ' : '↓ ') + (Math.abs(harmony.momentum) * 100).toFixed(0) + '%';
  document.getElementById('volatility').textContent = (harmony.volatility * 100).toFixed(0) + '%';
  
  // Restart animation
  if (animationId) cancelAnimationFrame(animationId);
  draw(growth, flow, harmony);
  
  // Restart sound if playing
  if (isPlaying) {
    stopSound();
    startSound(growth, flow, harmony);
  }
}

// ─── EVENT LISTENERS ────────────────────────────────────────────────

document.getElementById('playBtn').addEventListener('click', async () => {
  const btn = document.getElementById('playBtn');
  if (isPlaying) {
    stopSound();
    btn.textContent = '▶ Listen';
  } else {
    await startSound(growth, flow, harmony);
    btn.textContent = '⏸ Pause';
  }
});

document.getElementById('regenBtn').addEventListener('click', regenerate);

// ─── INIT ───────────────────────────────────────────────────────────

regenerate();

</script>
</body>
</html>
