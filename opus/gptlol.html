<title>2D Fluid Sim (Stable Fluids) — single file</title> <style> :root { color-scheme: dark; --bg: #0f1115; --panel: #151821; --text: #e7e9ee; --accent: #5cc8ff; --muted: #8c92a4; } html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; } .wrap { display: grid; grid-template-columns: 1fr 320px; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 10px; } canvas#view { width: 100%; height: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; border: 1px solid #23273a; image-rendering: pixelated; } .panel { background: var(--panel); border: 1px solid #23273a; border-radius: 10px; padding: 14px; position: sticky; top: 10px; height: fit-content; } .row { margin-bottom: 12px; } .row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; } input[type="range"] { width: 100%; } .small { font-size: 12px; color: var(--muted); } .buttons { display: flex; gap: 8px; flex-wrap: wrap; } button { background: #20263a; color: var(--text); border: 1px solid #2a2f45; border-radius: 8px; padding: 8px 12px; cursor: pointer; } button:hover { border-color: var(--accent); } .title { font-weight: 700; margin-bottom: 8px; } .hint { font-size: 12px; color: var(--muted); margin-top: 8px; } .kbd { background: #22273a; border: 1px solid #2b3250; padding: 0 6px; border-radius: 5px; } .stat { font-size: 12px; color: var(--muted); } @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } } </style>

<script> (() => { // Grid resolution (N x N), with (N+2) internal grid for boundary handling const N = 128; // bump to 192 if your machine is spicy const SIZE = (N + 2) * (N + 2); // Simulation params (adjustable via UI) let diff = 0.0002; // density diffusion let visc = 0.0001; // velocity diffusion (viscosity) let dt = 1 / 60; // base timestep; we’ll adapt with frame time but keep it stable const iter = 20; // Gauss–Seidel iterations // Arrays (Float32 for perf) const u = new Float32Array(SIZE); const v = new Float32Array(SIZE); const u_prev = new Float32Array(SIZE); const v_prev = new Float32Array(SIZE); const densR = new Float32Array(SIZE); const densG = new Float32Array(SIZE); const densB = new Float32Array(SIZE); const densR0 = new Float32Array(SIZE); const densG0 = new Float32Array(SIZE); const densB0 = new Float32Array(SIZE); // Helpers const IX = (x, y) => (x + (N + 2) * y); function addSource(x, s, dt) { for (let i = 0; i < SIZE; i++) x[i] += dt * s[i]; } function set_bnd(b, x) { for (let i = 1; i <= N; i++) { x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)]; x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)]; x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)]; x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)]; } x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]); x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]); x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]); x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]); } function lin_solve(b, x, x0, a, c) { const cRecip = 1.0 / c; for (let k = 0; k < iter; k++) { for (let i = 1; i <= N; i++) { let idx = IX(1, i); for (let j = 1; j <= N; j++, idx++) { x[idx] = (x0[idx] + a * (x[idx - 1] + x[idx + 1] + x[idx - (N + 2)] + x[idx + (N + 2)])) * cRecip; } } set_bnd(b, x); } } function diffuse(b, x, x0, diff, dt) { const a = dt * diff * N * N; lin_solve(b, x, x0, a, 1 + 4 * a); } function project(u, v, p, div) { for (let i = 1; i <= N; i++) { for (let j = 1; j <= N; j++) { const idx = IX(i, j); div[idx] = -0.5 * ( u[IX(i + 1, j)] - u[IX(i - 1, j)] + v[IX(i, j + 1)] - v[IX(i, j - 1)] ) / N; p[idx] = 0; } } set_bnd(0, div); set_bnd(0, p); lin_solve(0, p, div, 1, 4); for (let i = 1; i <= N; i++) { for (let j = 1; j <= N; j++) { const idx = IX(i, j); u[idx] -= 0.5 * N * (p[IX(i + 1, j)] - p[IX(i - 1, j)]); v[idx] -= 0.5 * N * (p[IX(i, j + 1)] - p[IX(i, j - 1)]); } } set_bnd(1, u); set_bnd(2, v); } function advect(b, d, d0, u, v, dt) { const dt0 = dt * N; for (let i = 1; i <= N; i++) { for (let j = 1; j <= N; j++) { let x = i - dt0 * u[IX(i, j)]; let y = j - dt0 * v[IX(i, j)]; if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5; if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5; const i0 = Math.floor(x), i1 = i0 + 1; const j0 = Math.floor(y), j1 = j0 + 1; const s1 = x - i0, s0 = 1 - s1; const t1 = y - j0, t0 = 1 - t1; d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) + s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]); } } set_bnd(b, d); } function vel_step(u, v, u0, v0, visc, dt) { addSource(u, u0, dt); addSource(v, v0, dt); // swap buffers: u0 <-> u, v0 <-> v [u0, u] = [u, u0]; diffuse(1, u, u0, visc, dt); [v0, v] = [v, v0]; diffuse(2, v, v0, visc, dt); project(u, v, u0, v0); [u0, u] = [u, u0]; [v0, v] = [v, v0]; advect(1, u, u0, u0, v0, dt); advect(2, v, v0, u0, v0, dt); project(u, v, u0, v0); } function dens_step(d, d0, u, v, diff, dt) { addSource(d, d0, dt); [d0, d] = [d, d0]; diffuse(0, d, d0, diff, dt); [d0, d] = [d, d0]; advect(0, d, d0, u, v, dt); } // Rendering const canvas = document.getElementById('view'); const ctx = canvas.getContext('2d'); // Offscreen buffer at grid resolution (for crisp scaling) const off = document.createElement('canvas'); off.width = N; off.height = N; const offCtx = off.getContext('2d', { willReadFrequently: true }); let imageData = offCtx.createImageData(N, N); function resize() { // Keep canvas square, fill available width in its grid cell const rect = canvas.getBoundingClientRect(); const size = Math.min(rect.width, rect.height || rect.width); canvas.width = size * devicePixelRatio; canvas.height = size * devicePixelRatio; ctx.imageSmoothingEnabled = false; } const ro = new ResizeObserver(resize); ro.observe(canvas); function renderDye() { const data = imageData.data; let idx = 0; for (let j = 1; j <= N; j++) { for (let i = 1; i <= N; i++) { const s = IX(i, j); const r = Math.max(0, Math.min(255, densR[s] * 255)); const g = Math.max(0, Math.min(255, densG[s] * 255)); const b = Math.max(0, Math.min(255, densB[s] * 255)); data[idx++] = r; data[idx++] = g; data[idx++] = b; data[idx++] = 255; } } offCtx.putImageData(imageData, 0, 0); ctx.drawImage(off, 0, 0, canvas.width, canvas.height); } function clearArray(arr) { arr.fill(0); } function clearAll() { u.fill(0); v.fill(0); u_prev.fill(0); v_prev.fill(0); densR.fill(0); densG.fill(0); densB.fill(0); densR0.fill(0); densG0.fill(0); densB0.fill(0); } // UI const colorEl = document.getElementById('color'); const brushEl = document.getElementById('brush'); const diffEl = document.getElementById('diff'); const viscEl = document.getElementById('visc'); const forceEl = document.getElementById('force'); const brushLabel = document.getElementById('brushLabel'); const diffLabel = document.getElementById('diffLabel'); const viscLabel = document.getElementById('viscLabel'); const forceLabel = document.getElementById('forceLabel'); const statEl = document.getElementById('stat'); const pauseBtn = document.getElementById('pauseBtn'); const clearBtn = document.getElementById('clearBtn'); let brush = parseInt(brushEl.value, 10); brushLabel.textContent = `(${brush} cells)`; brushEl.addEventListener('input', () => { brush = parseInt(brushEl.value, 10); brushLabel.textContent = `(${brush} cells)`; }); diffLabel.textContent = `(${parseFloat(diffEl.value)})`; diffEl.addEventListener('input', () => { diff = parseFloat(diffEl.value); diffLabel.textContent = `(${diff})`; }); viscLabel.textContent = `(${parseFloat(viscEl.value)})`; viscEl.addEventListener('input', () => { visc = parseFloat(viscEl.value); viscLabel.textContent = `(${visc})`; }); let forceScale = parseFloat(forceEl.value); forceLabel.textContent = `(${forceScale})`; forceEl.addEventListener('input', () => { forceScale = parseFloat(forceEl.value); forceLabel.textContent = `(${forceScale})`; }); clearBtn.addEventListener('click', clearAll); let paused = false; pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; }); // Mouse interaction let isDown = false; let lastX = 0, lastY = 0; canvas.addEventListener('mousedown', (e) => { isDown = true; const p = getMouseGrid(e); lastX = p.x; lastY = p.y; splatAtMouse(p); }); window.addEventListener('mouseup', () => { isDown = false; }); canvas.addEventListener('mouseleave', () => { isDown = false; }); canvas.addEventListener('mousemove', (e) => { if (!isDown) return; const p = getMouseGrid(e); applyDragForce(p.x, p.y, lastX, lastY); splatAtMouse(p); lastX = p.x; lastY = p.y; }); function getMouseGrid(e) { const rect = canvas.getBoundingClientRect(); const mx = (e.clientX - rect.left) * devicePixelRatio; const my = (e.clientY - rect.top) * devicePixelRatio; const gx = Math.max(1, Math.min(N, Math.floor((mx / canvas.width) * N) + 1)); const gy = Math.max(1, Math.min(N, Math.floor((my / canvas.height) * N) + 1)); return { x: gx, y: gy }; } function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 }; } function splatDensity(cx, cy, radius, R, G, B, strength = 30) { const r2 = radius * radius; for (let y = -radius; y <= radius; y++) { const yy = cy + y; if (yy < 1 || yy > N) continue; for (let x = -radius; x <= radius; x++) { const xx = cx + x; if (xx < 1 || xx > N) continue; const d2 = x*x + y*y; if (d2 > r2) continue; const w = 1 - Math.sqrt(d2) / radius; // soft falloff const idx = IX(xx, yy); densR0[idx] += R * w * strength; densG0[idx] += G * w * strength; densB0[idx] += B * w * strength; } } } function splatVelocity(cx, cy, radius, fx, fy) { const r2 = radius * radius; for (let y = -radius; y <= radius; y++) { const yy = cy + y; if (yy < 1 || yy > N) continue; for (let x = -radius; x <= radius; x++) { const xx = cx + x; if (xx < 1 || xx > N) continue; const d2 = x*x + y*y; if (d2 > r2) continue; const w = 1 - Math.sqrt(d2) / radius; const idx = IX(xx, yy); u_prev[idx] += fx * w; v_prev[idx] += fy * w; } } } function applyDragForce(x, y, px, py) { const dx = x - px; const dy = y - py; // scale with force slider; user units are in grid cells per frame splatVelocity(x, y, brush, dx * forceScale, dy * forceScale); } function splatAtMouse(p) { const { r, g, b } = hexToRgb(colorEl.value); splatDensity(p.x, p.y, brush, r, g, b); } // Main loop let lastTime = performance.now(); let acc = 0; let fpsAccum = 0, fpsCount = 0, lastFpsTime = performance.now(); function loop(now) { requestAnimationFrame(loop); const frame = Math.min(0.04, (now - lastTime) / 1000); // clamp dt to keep stable lastTime = now; if (!paused) { // semi-fixed timestep for stability acc += frame; const stepSize = dt; while (acc >= stepSize) { step(stepSize); acc -= stepSize; } renderDye(); } // fps stat fpsAccum += frame; fpsCount++; if (now - lastFpsTime > 500) { const fps = (fpsCount / fpsAccum).toFixed(0); statEl.textContent = `Grid: ${N}×${N} | FPS: ${fps} | Diff: ${diff} | Visc: ${visc}`; fpsAccum = 0; fpsCount = 0; lastFpsTime = now; } } function step(dtLocal) { vel_step(u, v, u_prev, v_prev, visc, dtLocal); dens_step(densR, densR0, u, v, diff, dtLocal); dens_step(densG, densG0, u, v, diff, dtLocal); dens_step(densB, densB0, u, v, diff, dtLocal); // Clear sources so we only inject per-frame when dragging u_prev.fill(0); v_prev.fill(0); densR0.fill(0); densG0.fill(0); densB0.fill(0); } // Kick it off resize(); requestAnimationFrame(loop); // Some quick keyboard helpers window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'c') clearAll(); if (e.key.toLowerCase() === 'p') { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; } }); // Initial gentle swirl to show it’s alive (function seed() { const R = 0.4, G = 0.2, B = 0.8; for (let k = 0; k < 12; k++) { const x = Math.floor(N * (0.25 + 0.5 * Math.random())) + 1; const y = Math.floor(N * (0.25 + 0.5 * Math.random())) + 1; splatDensity(x, y, 8, R, G, B, 15); splatVelocity(x, y, 10, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100); } })(); })(); </script>
