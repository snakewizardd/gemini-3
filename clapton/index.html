<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILAMENT</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#d9b67a;font-family:Georgia,'Times New Roman',serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
#veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;background:rgba(0,0,0,.72);transition:opacity 1.2s;z-index:3;text-align:center}
#veil.gone{opacity:0;pointer-events:none}
#veil h1{margin:0;font-weight:400;font-size:clamp(34px,6vw,76px);letter-spacing:.42em;color:#e7c486;text-indent:.42em}
#veil .sub{font-size:13px;letter-spacing:.3em;color:#8d7650;text-transform:uppercase}
#veil .go{margin-top:18px;font-size:13px;letter-spacing:.35em;color:#c89a52;text-transform:uppercase}
#veil .err{font:12px monospace;color:#d05030;max-width:70ch}
#bar{position:fixed;left:18px;bottom:14px;display:flex;gap:14px;align-items:center;font:12px/1 Georgia,serif;letter-spacing:.18em;color:#8d7650;opacity:0;transition:opacity .6s;z-index:4;user-select:none}
#bar.show{opacity:.85}
#bar button{background:none;border:1px solid #4a3c28;color:#c89a52;font:12px Georgia,serif;letter-spacing:.2em;padding:6px 12px;cursor:pointer}
#bar button:hover{border-color:#c89a52}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><h1>FILAMENT</h1><div class="sub">a blues in A minor · for the String Engine</div><div class="go" id="go">click to warm the tubes</div><div class="err" id="err"></div></div>
<div id="bar"><button id="pp">pause</button><button id="rs">restart</button><span id="tm">0:00 / 0:00</span></div>
<script src="src/engine.js"></script>
<script src="src/composition.js"></script>
<script src="src/visual.js"></script>
<script src="output/telemetry.js" onerror="window.FILAMENT_TELEMETRY=null"></script>
<script>
'use strict';
// Transport model:
//  • The AudioContext clock is the only clock. Song time  s = ctx.currentTime − t0.
//  • At start the whole string score is queued in the worklets (sample-exact, immune to timer
//    throttling); a setInterval scheduler (never requestAnimationFrame) creates drum/organ/automation
//    nodes for the window [s, s + lookahead]. An audio-clock sentinel triggers completion.
//  • All transport actions run through one serialized queue; each start owns its own context.
//  • The picture is draw(gl, s): a pure function of song time, so dropped frames, pause and
//    resume cannot desynchronise it. Pause = ctx.suspend() (the clock itself stops).
//  • Restart closes the context (every node, worklet and pending event is released) and
//    rebuilds from t = 0. Completion stops the scheduler, closes the context and holds the final image.
(function () {
  const S = window.FilamentScore, END = S.meta.duration;
  const $ = id => document.getElementById(id);
  const canvas = $('c'), veil = $('veil'), bar = $('bar');
  let vis = null, ctx = null, eng = null, t0 = 0, timer = 0, state = 'idle', cursor = 0, gen = 0, hideT = 0, endedAt = END;
  const posted = { lead: 0, rhythm: 0, bass: 0, native: 0, ticks: 0, late: 0 };

  try {
    vis = FilamentVisual.create(canvas, S, window.FILAMENT_TELEMETRY, { width: 960, height: 540 });
  } catch (e) { $('err').textContent = 'Visual engine unavailable: ' + e.message; }

  function fit() {
    if (!vis) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const scale = 0.62;                                   // raymarched at 62% and upscaled: keeps the picture fluid
    const w = Math.max(320, Math.round(innerWidth * dpr * scale)), h = Math.max(180, Math.round(innerHeight * dpr * scale));
    vis.resize(w, h);
  }
  addEventListener('resize', fit); fit();

  const songTime = () => state === 'ended' ? endedAt : (!ctx || state === 'idle' || state === 'starting') ? 0 : Math.max(0, Math.min(END, ctx.currentTime - t0));
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  // Native nodes (drums, organ, automation) are created just ahead of time ? pending nodes cost CPU.
  function tick() {
    if (!ctx || state !== 'playing' || ctx.state !== 'running') return;
    posted.ticks++;
    const s = ctx.currentTime - t0, horizon = s + (document.hidden ? 20 : 2.5);
    const nat = [];
    while (cursor < S.native.length && S.native[cursor].t < horizon) {
      const c = S.native[cursor++];
      if (c.t < s + 0.005) posted.late++; else nat.push(c);   // never schedule into the past
    }
    eng.scheduleNative(nat, t0); posted.native += nat.length;
    if (s >= END) finish(ctx);
  }

  // Every transport action is serialized through one queue, so start/pause/resume/restart can never interleave.
  let queue = Promise.resolve();
  const run = fn => (queue = queue.then(fn).catch(e => { $('err').textContent = 'Transport error: ' + (e && e.message || e); }));

  async function start() {
    const my = ++gen;
    state = 'starting';
    const AC = window.AudioContext || window.webkitAudioContext;
    const c = new AC({ latencyHint: 'playback', sampleRate: S.meta.sampleRate });
    try {
      const e = await FilamentEngine.build(c, { seed: S.meta.seed, events: { lead: [], rhythm: [], bass: [] } });
      if (c.state !== 'running') await c.resume();
      if (my !== gen) { await c.close(); return; }
      ctx = c; eng = e; cursor = 0;
      t0 = c.currentTime + 0.3;
      eng.postStrings(S.cmds, t0);                          // the whole string score, queued sample-exactly in the worklets
      posted.lead += S.cmds.lead.length; posted.rhythm += S.cmds.rhythm.length; posted.bass += S.cmds.bass.length;
      const sentinel = c.createConstantSource();           // completion is driven by the audio clock itself
      sentinel.offset.value = 0; sentinel.connect(c.destination);
      sentinel.onended = () => { if (ctx === c && state === 'playing') finish(c); };
      sentinel.start(t0); sentinel.stop(t0 + END);
      state = 'playing';
      tick();
      timer = setInterval(tick, 40);
      veil.classList.add('gone'); $('pp').textContent = 'pause'; poke();
    } catch (err) {
      if (c.state !== 'closed') await c.close().catch(() => {});
      if (my === gen) state = 'idle';
      throw err;
    }
  }
  function finish(c) {
    if (c !== ctx || state === 'ended') return;
    clearInterval(timer); timer = 0;
    endedAt = END; state = 'ended'; ctx = null; eng = null;
    c.close().catch(() => {});
    $('pp').textContent = 'play'; showBar(true);
  }
  async function teardown() {
    gen++;
    clearInterval(timer); timer = 0;
    const c = ctx; ctx = null; eng = null;
    if (c && c.state !== 'closed') await c.close().catch(() => {});
  }
  const restart = () => run(async () => { await teardown(); state = 'idle'; await start(); });
  const toggle = () => run(async () => {
    if (state === 'ended') { await teardown(); state = 'idle'; return start(); }
    if (state === 'playing' && ctx) { const c = ctx; state = 'pausing'; await c.suspend(); if (c === ctx) { state = 'paused'; $('pp').textContent = 'play'; showBar(true); } }
    else if (state === 'paused' && ctx) { const c = ctx; state = 'resuming'; await c.resume(); if (c === ctx) { state = 'playing'; $('pp').textContent = 'pause'; tick(); poke(); } }
  });

  veil.addEventListener('click', () => { if (state === 'idle') run(start); });
  $('pp').addEventListener('click', e => { e.stopPropagation(); toggle(); });
  $('rs').addEventListener('click', e => { e.stopPropagation(); if (state !== 'idle') restart(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (state === 'idle') run(start); else toggle(); }
    else if (e.code === 'KeyR' && state !== 'idle') restart();
  });
  function showBar(stay) { bar.classList.add('show'); clearTimeout(hideT); if (!stay) hideT = setTimeout(() => { if (state === 'playing') bar.classList.remove('show'); }, 2200); }
  function poke() { showBar(false); }
  addEventListener('pointermove', () => { if (state !== 'idle') poke(); });

  function frame() {
    requestAnimationFrame(frame);
    const s = songTime();
    if (vis) vis.draw(s);
    $('tm').textContent = fmt(s) + ' / ' + fmt(END);
  }
  requestAnimationFrame(frame);

  // inspection hooks (used by the automated transport validation)
  window.FILAMENT_PLAYER = {
    state: () => state, songTime, posted, audioState: () => ctx ? ctx.state : 'none',
    pause: () => state === 'playing' && toggle(), resume: () => state === 'paused' && toggle(), restart, idle: () => queue,
    visualState: t => vis && vis.stateAt(t)
  };
})();
</script>
</body>
</html>
