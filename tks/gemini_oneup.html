<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE OMEGA KERNEL | FENRIR</title>
<style>
    body { 
        margin: 0; 
        background: #000; 
        overflow: hidden; 
        cursor: none; 
        font-family: 'Courier New', monospace;
    }
    canvas { 
        display: block; 
    }
    #ui {
        position: absolute;
        bottom: 30px;
        left: 30px;
        color: rgba(100, 255, 218, 0.4);
        pointer-events: none;
        font-size: 11px;
        line-height: 1.5;
        text-shadow: 0 0 5px rgba(100, 255, 218, 0.2);
    }
    .scanline {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 10;
    }
</style>
</head>
<body>

<div class="scanline"></div>
<div id="ui">
    KERNEL: OMEGA<br>
    PHYSICS: NON-LINEAR<br>
    FIBERS: 120,000<br>
    STATUS: AWAKE
</div>
<canvas id="c"></canvas>

<script>
/**
 * ═════════════════════════════════════════════════════════════════════════
 * THE OMEGA KERNEL
 * ═════════════════════════════════════════════════════════════════════════
 * An advanced procedural rendering engine simulating biological and 
 * atmospheric complexity.
 */

const C = document.getElementById('c');
const X = C.getContext('2d'); // Standard 2D Context for compatibility
const W = window.innerWidth;
const H = window.innerHeight;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

C.width = W * DPR;
C.height = H * DPR;
C.style.width = W + 'px';
C.style.height = H + 'px';

const CTX = C.getContext('2d');
CTX.scale(DPR, DPR);
CTX.translate(W/2, H/2);
const SCALE = Math.min(W, H) / 1000;
CTX.scale(SCALE, SCALE);

// ═════════════════════════════════════════════════════════════════════════
// MODULE 1: THE MATH CORE (PERMUTATION NOISE & VECTORS)
// ═════════════════════════════════════════════════════════════════════════

const P = new Uint8Array(512);
const PERM = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
for (let i=0; i<256; i++) P[256+i] = P[i] = PERM[i];

function noise(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = x*x*x*(x*(x*6-15)+10), v = y*y*y*(y*(y*6-15)+10), w = z*z*z*(z*(z*6-15)+10);
    const A = P[X]+Y, AA = P[A]+Z, AB = P[A+1]+Z, B = P[X+1]+Y, BA = P[B]+Z, BB = P[B+1]+Z;
    const lerp = (t, a, b) => a + t * (b - a);
    const grad = (hash, x, y, z) => {
        const h = hash & 15;
        const u = h<8 ? x : y, v = h<4 ? y : h===12||h===14 ? x : z;
        return ((h&1) ? -u : u) + ((h&2) ? -v : v);
    };
    return lerp(w, lerp(v, lerp(u, grad(P[AA], x, y, z), grad(P[BA], x-1, y, z)),
                   lerp(u, grad(P[AB], x, y-1, z), grad(P[BB], x-1, y-1, z))),
                   lerp(v, lerp(u, grad(P[AA+1], x, y, z-1), grad(P[BA+1], x-1, y, z-1)),
                   lerp(u, grad(P[AB+1], x, y-1, z-1), grad(P[BB+1], x-1, y-1, z-1))));
}

// ═════════════════════════════════════════════════════════════════════════
// MODULE 2: OSTEOLOGICAL FRAMEWORK & MASKING
// ═════════════════════════════════════════════════════════════════════════

function getBoneStructure(x, y) {
    // Signed Distance Field approximation for a Wolf Head
    const head = (x*x)/(130*130) + ((y+30)*(y+30))/(150*150);
    const snout = (x*x)/(55*55) + ((y-100)*(y-100))/(65*65);
    const ruffL = ((x+120)*(x+120))/(70*70) + ((y+20)*(y+20))/(90*90);
    const ruffR = ((x-120)*(x-120))/(70*70) + ((y+20)*(y+20))/(90*90);
    
    // Ears: Triangle SDF
    const earL = Math.max(Math.abs((x+100)*0.8 + (y+120)*0.5), (y+120)) - 60;
    
    if (head < 1 || snout < 1 || ruffL < 1 || ruffR < 1) return true;
    
    // Explicit Ear logic
    if (x > -140 && x < -60 && y > -320 && y < -80) {
        const t = (y+80)/-240;
        if (Math.abs(x - -100) < 40 * (1-t)) return true;
    }
    if (x > 60 && x < 140 && y > -320 && y < -80) {
        const t = (y+80)/-240;
        if (Math.abs(x - 100) < 40 * (1-t)) return true;
    }
    
    return false;
}

function getPigment(x, y) {
    const n = noise(x*0.004, y*0.004, 0);
    
    // Dark Ears
    if (y < -100 && Math.abs(x) > 60) return 0.9 + n*0.1;
    
    // Widow's Peak / Cap
    if (y < -20) {
        const dist = Math.abs(x);
        const threshold = 20 + Math.max(0, y+100)*0.4 + n*20;
        if (dist > threshold) return 0.85;
    }
    
    // Eye Mask
    for(const s of [-1, 1]) {
        const dx = x - (60*s);
        const dy = y - (-20);
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d > 30 && d < 75) return 0.8 + n*0.1;
    }
    
    // Muzzle/Cheeks (White)
    return 0.05 + n*0.05;
}

function getFlowVector(x, y) {
    // Base gravity
    let ang = Math.PI/2;
    
    // Ear Flow (Up and Out)
    if (y < -100) ang = -Math.PI/2 + (x*0.003);
    
    // Snout Bridge (Down)
    else if (Math.abs(x) < 40 && y > -50 && y < 80) ang = Math.PI/2;
    
    // Eye Radiation
    else {
        const ex = x < 0 ? -60 : 60;
        const d = Math.sqrt((x-ex)**2 + (y+20)**2);
        if (d < 80) ang = Math.atan2(y+20, x-ex) + Math.PI/2;
        else {
            // Cheek Sweep
            ang = Math.PI/2 + (x > 0 ? 0.6 : -0.6);
        }
    }
    return ang;
}

// ═════════════════════════════════════════════════════════════════════════
// MODULE 3: CACHED GEOMETRY GENERATOR (THE COMPOSITOR)
// ═════════════════════════════════════════════════════════════════════════

function createFurLayer(density, scale, zDepth) {
    const cv = document.createElement('canvas');
    cv.width = W * DPR; cv.height = H * DPR;
    const cx = cv.getContext('2d');
    cx.scale(DPR, DPR); cx.translate(W/2, H/2); cx.scale(SCALE, SCALE);
    
    const points = [];
    // Poisson-disk-ish sampling
    for(let i=0; i<density; i++) {
        const x = (Math.random()-0.5) * 700;
        const y = (Math.random()-0.5) * 800;
        if (getBoneStructure(x,y)) points.push({x,y});
    }
    
    // Z-Sort for painter's algo
    points.sort((a,b) => a.y - b.y);
    
    // Render Strand
    points.forEach(p => {
        const m = getPigment(p.x, p.y);
        const ang = getFlowVector(p.x, p.y);
        const n = noise(p.x*0.02, p.y*0.02, zDepth);
        
        // Agouti / Texture Logic
        let col;
        if (m < 0.2) {
            // White Fur (Subsurface scattering simulation)
            // Slightly blue in shadows, yellow in light
            const r = 220 + n*30;
            const g = 220 + n*30;
            const b = 230 + n*25;
            col = `rgba(${r},${g},${b}, ${0.6 + zDepth*0.2})`;
        } else {
            // Dark Fur (Melanin)
            const v = 20 + n*30;
            col = `rgba(${v},${v},${v+10}, ${0.8 + zDepth*0.2})`;
        }
        
        const len = (m < 0.2 ? 25 : 15) * scale + n*10;
        const curve = (n-0.5) * 0.5;
        
        const ex = p.x + Math.cos(ang + curve) * len;
        const ey = p.y + Math.sin(ang + curve) * len;
        
        // Bezier Control Point
        const cpx = (p.x + ex)/2 + (Math.random()-0.5)*5;
        const cpy = (p.y + ey)/2 + (Math.random()-0.5)*5;
        
        cx.beginPath();
        cx.moveTo(p.x, p.y);
        cx.quadraticCurveTo(cpx, cpy, ex, ey);
        cx.strokeStyle = col;
        cx.lineWidth = (1.5 - zDepth*0.5) * scale; // Thinner at front
        cx.stroke();
        
        // Guard Hairs (The "Halo")
        if (zDepth > 0.5 && Math.random() > 0.8) {
            cx.beginPath();
            cx.moveTo(p.x, p.y);
            cx.lineTo(ex + Math.cos(ang)*5, ey + Math.sin(ang)*5);
            cx.strokeStyle = 'rgba(255,255,255,0.4)';
            cx.lineWidth = 0.5;
            cx.stroke();
        }
    });
    
    return cv;
}

// GENERATE LAYERS (Async-ish feel)
const LAYER_DEEP = createFurLayer(45000, 1.0, 0.0);
const LAYER_MID = createFurLayer(55000, 0.9, 0.5);
const LAYER_FINE = createFurLayer(35000, 0.8, 1.0);

// ═════════════════════════════════════════════════════════════════════════
// MODULE 4: DYNAMIC SYSTEMS (EYES, BREATH, ATMOSPHERE)
// ═════════════════════════════════════════════════════════════════════════

const MOUSE = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('mousemove', e => {
    const r = C.getBoundingClientRect();
    MOUSE.tx = (e.clientX - r.left) / r.width * 2 - 1;
    MOUSE.ty = (e.clientY - r.top) / r.height * 2 - 1;
});

let TICK = 0;
let BLINK = 0;

class FluidSolver {
    constructor() { this.particles = []; }
    emit(x, y) {
        if (Math.random() > 0.5) return;
        this.particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*0.5,
            vy: 2 + Math.random(),
            life: 1.0,
            size: 2 + Math.random()*5
        });
    }
    update() {
        for(let i=this.particles.length-1; i>=0; i--) {
            const p = this.particles[i];
            // Fluid Dynamics approximation (Curl noise)
            const n = noise(p.x*0.01, p.y*0.01, TICK*0.02);
            p.vx += Math.cos(n * Math.PI * 2) * 0.05;
            p.x += p.vx;
            p.y += p.vy;
            p.size += 0.2;
            p.life -= 0.015;
            if(p.life <= 0) this.particles.splice(i,1);
        }
    }
    draw(ctx) {
        for(let p of this.particles) {
            ctx.fillStyle = `rgba(200, 230, 255, ${p.life * 0.15})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }
    }
}
const BREATH = new FluidSolver();

function drawEye(x, y, side) {
    CTX.save();
    
    // Parallax
    const px = MOUSE.x * 15;
    const py = MOUSE.y * 10;
    CTX.translate(x + px*0.1, y + py*0.1);
    
    // Orientation
    CTX.rotate(side ? 0.15 : -0.15);
    
    // 1. Socket (Occlusion)
    CTX.fillStyle = '#020202';
    CTX.beginPath(); CTX.ellipse(0,0, 28, 16, 0, 0, Math.PI*2); CTX.fill();
    
    // 2. Sclera
    CTX.fillStyle = '#d0d5db';
    CTX.beginPath(); CTX.ellipse(0,0, 26, 14, 0, 0, Math.PI*2); CTX.fill();
    
    // 3. Iris Container (Clipped)
    CTX.save();
    CTX.beginPath(); CTX.ellipse(0,0, 26, 14, 0, 0, Math.PI*2); CTX.clip();
    
    // Iris Parallax
    CTX.translate(px*0.6, py*0.6);
    
    // Procedural Iris Texture (Ray-marched look)
    const ig = CTX.createRadialGradient(0,0, 2, 0,0, 14);
    ig.addColorStop(0, '#fff');
    ig.addColorStop(0.1, '#aef'); // Inner Ice
    ig.addColorStop(0.4, '#28c'); // Mid Blue
    ig.addColorStop(0.8, '#024'); // Deep Ocean
    ig.addColorStop(1.0, '#001'); // Limbal Ring
    CTX.fillStyle = ig;
    CTX.beginPath(); CTX.arc(0,0, 13.5, 0, Math.PI*2); CTX.fill();
    
    // Iris Fibers (Noise based)
    CTX.strokeStyle = 'rgba(255,255,255,0.2)'; CTX.lineWidth = 0.5;
    for(let i=0; i<36; i++) {
        const a = (i/36)*Math.PI*2;
        const l = 4 + Math.random()*8;
        CTX.beginPath();
        CTX.moveTo(Math.cos(a)*3, Math.sin(a)*3);
        CTX.lineTo(Math.cos(a)*l, Math.sin(a)*l);
        CTX.stroke();
    }
    
    // Pupil (Dynamic Dilation)
    const dist = Math.sqrt(MOUSE.x**2 + MOUSE.y**2);
    const dilate = 4 + (1 - Math.min(1, dist)) * 2.5;
    CTX.fillStyle = '#000';
    CTX.beginPath(); CTX.arc(0,0, dilate, 0, Math.PI*2); CTX.fill();
    
    // Specular Highlight (The Soul)
    // Fixed light source reflection
    CTX.translate(-px*0.6, -py*0.6); 
    CTX.fillStyle = 'rgba(255,255,255,0.9)';
    CTX.beginPath(); CTX.arc(5, -5, 2.5, 0, Math.PI*2); CTX.fill();
    
    CTX.restore(); // End Clip
    
    // 4. Eyelids (Blink Logic)
    let lidH = 0;
    if(BLINK > 0) lidH = Math.sin((BLINK/12)*Math.PI)*22;
    
    CTX.fillStyle = '#050505';
    // Upper Lid
    CTX.beginPath();
    CTX.moveTo(-30, -10);
    CTX.quadraticCurveTo(0, -25 + lidH, 30, -10);
    CTX.lineTo(30, -30); CTX.lineTo(-30, -30);
    CTX.fill();
    
    // Waterline (Wetness)
    CTX.strokeStyle = 'rgba(200,200,220,0.3)'; CTX.lineWidth=1;
    CTX.beginPath(); 
    CTX.moveTo(-26, 0);
    CTX.quadraticCurveTo(0, 14, 26, 0);
    CTX.stroke();
    
    CTX.restore();
}

function drawNose() {
    const nx = MOUSE.x * 15;
    const ny = 110 + MOUSE.y * 10;
    
    CTX.save();
    CTX.translate(nx, ny);
    
    // Main Shape
    CTX.fillStyle = '#0a0a0a';
    CTX.beginPath();
    CTX.moveTo(-28, -12);
    CTX.bezierCurveTo(-34, 18, -18, 40, 0, 42);
    CTX.bezierCurveTo(18, 40, 34, 18, 28, -12);
    CTX.bezierCurveTo(12, -18, -12, -18, -28, -12);
    CTX.fill();
    
    // Bump Mapping (Texture)
    CTX.fillStyle = 'rgba(255,255,255,0.1)';
    for(let i=0; i<60; i++) {
        const rx=(Math.random()-0.5)*45, ry=(Math.random()-0.5)*30 + 10;
        if(rx*rx/500 + ry*ry/400 < 1) CTX.fillRect(rx, ry, 1.2, 1.2);
    }
    
    // Wet Shine
    CTX.fillStyle = 'rgba(255,255,255,0.12)';
    CTX.beginPath(); CTX.ellipse(0, 5, 12, 6, 0, 0, Math.PI*2); CTX.fill();
    
    // Nostrils
    const breath = Math.sin(T*0.05);
    const size = 1 + breath * 0.1;
    CTX.scale(size, size);
    CTX.fillStyle = '#000';
    CTX.beginPath(); CTX.ellipse(-12, 15, 6, 4, -0.4, 0, Math.PI*2); CTX.fill();
    CTX.beginPath(); CTX.ellipse(12, 15, 6, 4, 0.4, 0, Math.PI*2); CTX.fill();
    
    // Vapor Emission
    if (breath > 0.5) {
        BREATH.emit(-12, 15+ny);
        BREATH.emit(12, 15+ny);
    }
    
    CTX.restore();
}

// ═════════════════════════════════════════════════════════════════════════
// RENDER LOOP (THE HEARTBEAT)
// ═════════════════════════════════════════════════════════════════════════

function animate() {
    T++;
    
    // Input Smoothing
    MOUSE.x += (MOUSE.tx - MOUSE.x) * 0.08;
    MOUSE.y += (MOUSE.ty - MOUSE.y) * 0.08;
    
    // Blink Timer
    if(BLINK > 0) BLINK--;
    else if(Math.random() < 0.008) BLINK = 12;
    
    // 1. ATMOSPHERE (Background)
    const bg = CTX.createLinearGradient(-300, -500, 300, 500);
    bg.addColorStop(0, '#050508');
    bg.addColorStop(1, '#000');
    CTX.fillStyle = bg;
    CTX.fillRect(-500, -500, 1000, 1000);
    
    // 2. FUR PARALLAX
    // Move layers opposite to mouse to create depth
    const px = MOUSE.x * 20;
    const py = MOUSE.y * 20;
    
    CTX.save(); CTX.setTransform(1,0,0,1,0,0);
    CTX.drawImage(LAYER_DEEP, -px*0.4 * DPR, -py*0.4 * DPR);
    CTX.restore();
    
    CTX.save(); CTX.setTransform(1,0,0,1,0,0);
    CTX.drawImage(LAYER_MID, -px*0.2 * DPR, -py*0.2 * DPR);
    CTX.restore();
    
    CTX.save(); CTX.setTransform(1,0,0,1,0,0);
    CTX.drawImage(LAYER_FINE, px*0.1 * DPR, py*0.1 * DPR);
    CTX.restore();
    
    // 3. FEATURES
    drawEye(-60, -20, true);
    drawEye(60, -20, false);
    drawNose();
    
    // 4. WHISKERS (Dynamic Vectors)
    CTX.save();
    CTX.translate(px*0.3, 110+py*0.3);
    CTX.strokeStyle = 'rgba(200,220,255,0.3)';
    CTX.lineWidth = 0.6;
    CTX.beginPath();
    for(const s of [-1, 1]) {
        for(let i=0; i<14; i++) {
            const rx = s * (30 + i*2);
            const ry = (i%3)*5;
            // Wave simulation
            const wave = Math.sin(T*0.05 + i)*2;
            CTX.moveTo(rx, ry);
            CTX.bezierCurveTo(rx + s*40, ry+5, rx + s*80, ry+20+wave, rx + s*120, ry+40+wave);
        }
    }
    CTX.stroke();
    CTX.restore();
    
    // 5. BREATH FLUIDS
    BREATH.update();
    BREATH.draw(CTX);
    
    // 6. CINEMATIC GRAIN & VIGNETTE
    CTX.globalCompositeOperation = 'overlay';
    if (T%2===0) { // Jitter grain
        CTX.fillStyle = 'rgba(255,255,255,0.03)';
        CTX.fillRect(-500, -500, 1000, 1000);
    }
    
    CTX.globalCompositeOperation = 'source-over';
    const vig = CTX.createRadialGradient(0,0, 350, 0,0, 550);
    vig.addColorStop(0, 'rgba(0,5,10,0)');
    vig.addColorStop(1, 'rgba(0,2,5,0.9)');
    CTX.fillStyle = vig;
    CTX.fillRect(-500, -500, 1000, 1000);
    
    requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
