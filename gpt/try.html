<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alborada Opus Deluxe — Safety Version</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink:#eaf3ff; --muted:#9db2c9; --bg1:#0a0f14; --bg2:#0f1824;
  }
  html,body { margin:0; height:100%; background:radial-gradient(1200px 720px at 60% 22%, var(--bg2), var(--bg1)); color:var(--ink); font:14px/1.4 system-ui, Segoe UI, Inter, Roboto, Arial; overflow:hidden; }
  #canvas { position:fixed; inset:0; }
  header { position:fixed; top:14px; left:14px; right:14px; display:flex; align-items:center; justify-content:space-between; z-index:3; }
  .title { font-weight:700; letter-spacing:.3px; color:var(--ink); text-shadow:0 1px 0 rgba(0,0,0,.4); }
  .controls { display:flex; gap:10px; align-items:center; }
  button {
    appearance:none; border:1px solid #203047; background:rgba(17,26,40,.75); color:var(--ink);
    padding:8px 12px; border-radius:12px; cursor:pointer; backdrop-filter: blur(6px); font-weight:700;
  }
  button:hover { border-color:#2a3b57; }
  .pill { color:var(--muted); font-size:12px; border:1px solid #23344a; padding:4px 8px; border-radius:10px; }
  #tabPanel {
    position:fixed; right:14px; bottom:14px; left:14px; max-height:50%; overflow:auto; z-index:3;
    display:none; background:rgba(13,20,31,.86); border:1px solid #23344a; border-radius:12px; padding:12px; white-space:pre; color:#e7f1ff;
    font:12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  .foot { position:fixed; left:14px; bottom:14px; color:var(--muted); font-size:12px; z-index:3; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<header>
  <div class="title">Alborada Opus Deluxe — Spanish Guitar</div>
  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="tabBtn" title="Show/Hide TAB">TAB</button>
    <button id="fxBtn" title="Quality">HQ</button>
    <span class="pill">Safe Mode Active</span>
  </div>
</header>

<pre id="tabPanel"></pre>
<div class="foot">Click Play — Audio engine stabilized. Space toggles Play/Pause.</div>

<script>
(() => {
  // ===== visuals
  const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d', {alpha:false});
  let W=0, H=0, t0=performance.now();
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  addEventListener('resize', resize); resize();

  const rings = Array.from({length:28}, (_,i)=>({
    r: 64 + i*18, a: Math.random()*Math.PI*2, s: 0.00045 + i*0.00006, hue: 12 + i*3
  }));
  function draw(){
    const t=(performance.now()-t0);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#0f1824'); g.addColorStop(1, '#0a0f14');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const cx=W*0.53, cy=H*0.56;

    for(const o of rings){
      const a=o.a + t*o.s;
      ctx.beginPath(); ctx.arc(cx,cy,o.r,0,Math.PI*2);
      const alpha=0.06 + 0.04*Math.sin((t*0.00055+o.r)*0.45);
      ctx.strokeStyle=`hsla(${200+o.hue},80%,65%,${alpha})`; ctx.lineWidth=1; ctx.stroke();
      
      // glow
      const x=cx+Math.cos(a)*o.r, y=cy+Math.sin(a)*o.r;
      const rad=2.2+2*Math.sin(t*0.002+o.r*0.25);
      const g2=ctx.createRadialGradient(x,y,0,x,y,rad*5);
      g2.addColorStop(0, `hsla(${200+o.hue},85%,60%,0.45)`);
      g2.addColorStop(1, `hsla(${200+o.hue},85%,60%,0)`);
      ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x,y,rad*5,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ===== audio engine (Stabilized)
  const AE = {
    ctx:null, master:null, limiter:null, rev:null, revG:null, hq:true,
    async init(){
      if(this.ctx) return;
      const ac = this.ctx = new (window.AudioContext||window.webkitAudioContext)();

      // 1. SAFETY LIMITER (Brickwall)
      // This creates a non-linear curve that crushes any signal > 0.9
      this.limiter = ac.createWaveShaper();
      this.limiter.curve = this.makeDistortionCurve(0.95);
      this.limiter.oversample = '4x';

      // Master Volume
      this.master = ac.createGain(); 
      this.master.gain.setValueAtTime(0.7, ac.currentTime);

      // Reverb path
      this.rev  = ac.createConvolver(); 
      this.rev.buffer = mkImpulse(ac, 2.5, 2.5); // shorter tail
      this.revG = ac.createGain(); 
      this.revG.gain.setValueAtTime(0.25, ac.currentTime);

      // Chain: Inputs -> Master -> Limiter -> Destination
      //                 Master -> Reverb -> Limiter -> Destination
      this.master.connect(this.limiter);
      this.master.connect(this.rev);
      this.rev.connect(this.revG);
      this.revG.connect(this.limiter);
      this.limiter.connect(ac.destination);

      if(ac.state==='suspended') await ac.resume();
    },

    // A curve that behaves linearly until threshold, then clamps hard
    makeDistortionCurve(amount) {
      const k = 2 * amount / (1 - amount);
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      for (let i = 0; i < n_samples; ++i) {
        let x = (i * 2) / n_samples - 1;
        // Soft clipper
        curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    },

    setReverb(v){ if(this.revG) this.revG.gain.setTargetAtTime(Math.max(0,Math.min(0.5,v)), this.ctx.currentTime, 0.1); },

    // Stabilized Karplus-Strong
    pluck(freq, t, dur=1.6, vel=0.85, color=0.28){
      if(!this.ctx) return; const ac=this.ctx;
      
      // Safety Cap: Don't process frequencies above 10kHz to prevent aliasing screech
      if(freq > 10000) freq = 10000;

      // Noise Burst
      const len = Math.max(4, Math.floor(ac.sampleRate/freq));
      const buf = ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1 - 0.5*(i/len)); // darker noise
      const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;

      // Delay Line
      const delay=ac.createDelay(); 
      delay.delayTime.setValueAtTime(1/freq, t);

      // Filter (Damping) - REMOVED AllPass to prevent phase explosion
      // Only using LowPass now.
      const lp=ac.createBiquadFilter(); 
      lp.type='lowpass'; 
      // Cap filter freq to prevent explosion
      const safeFilt = Math.min(2500, freq*4); 
      lp.frequency.setValueAtTime(safeFilt, t); 
      lp.Q.setValueAtTime(0, t); // No resonance = No screech

      // Feedback Gain
      // High frequencies must decay faster. 
      // Formula: Base 0.93 minus a chunk for pitch. 
      // 82Hz (Low E) -> ~0.92
      // 800Hz (High) -> ~0.75
      let fbVal = 0.93 - (freq / 4000); 
      // Absolute safety clamp:
      if(fbVal > 0.88) fbVal = 0.88;
      if(fbVal < 0.1) fbVal = 0.1;

      const fb=ac.createGain(); 
      fb.gain.setValueAtTime(fbVal, t);

      // Output Envelope
      const out=ac.createGain(); 
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(0.6*vel, t+0.005);
      out.gain.exponentialRampToValueAtTime(0.001, t+dur);

      // Transient (Click) - reduced volume
      const click=ac.createBufferSource(); 
      const cb=ac.createBuffer(1, 400, ac.sampleRate); 
      const cd=cb.getChannelData(0);
      for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*Math.pow(1-i/400,3);
      const cg=ac.createGain(); 
      cg.gain.setValueAtTime(0.1*vel, t); 
      click.buffer=cb;

      // Graph: Src -> LP -> Delay -> FB -> LP ...
      src.connect(lp); 
      lp.connect(delay); 
      delay.connect(out);
      
      // Feedback loop
      delay.connect(fb);
      fb.connect(lp);

      out.connect(this.master);
      click.connect(cg); cg.connect(this.master);

      src.start(t); src.stop(t+dur+0.1);
      click.start(t);
    },

    palma(t, amp=0.22){
      if(!this.ctx) return; const ac=this.ctx;
      const n=ac.createBufferSource(); const nb=ac.createBuffer(1,2200,ac.sampleRate); const d=nb.getChannelData(0);
      for(let i=0;i<d.length;i++){ const env=Math.pow(1-i/d.length, 2.0); d[i]=(Math.random()*2-1)*env; }
      const hpf=ac.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.setValueAtTime(800, t);
      const g=ac.createGain(); g.gain.setValueAtTime(amp*0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
      n.buffer=nb; n.connect(hpf); hpf.connect(g); g.connect(this.master); n.start(t);
    }
  };

  function mkImpulse(ac, seconds, decay){
    const len=Math.floor(ac.sampleRate*seconds);
    const buf=ac.createBuffer(2,len,ac.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++){
        d[i]=(Math.random()*2-1)*Math.pow(1-i/len, decay);
      }
    }
    return buf;
  }

  // ===== helpers
  const A4=440, midiHz = m => A4*Math.pow(2,(m-69)/12);
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const jitter = (base, amt)=> base + (Math.random()*2-1)*amt;

  function rubatoAt(t, map){ 
    let mul=1.0;
    for(let i=0;i<map.length;i++){
      if(t>=map[i].atSec) mul=map[i].mul; else break;
    }
    return mul;
  }

  // ===== score
  const BASE_BPM=96;
  const baseBeat = 60/BASE_BPM;

  const RUBATO = [
    {atSec:0, mul:0.98},
    {atSec:10, mul:1.02},
    {atSec:30, mul:1.05},
    {atSec:60, mul:0.96}, 
    {atSec:75, mul:1.10}, 
    {atSec:110, mul:1.00},
    {atSec:150, mul:0.94}, 
    {atSec:185, mul:1.02}
  ];

  const VOX = {
    Em:[52,55,59,64,67],
    D:[50,57,62,66],
    C:[48,55,60,64,67],
    B7:[47,54,58,61,66],
    Am:[57,60,64,69]
  };
  const BASS = {
    Em:[40,47,52,47],
    D:[38,45,50,45],
    C:[36,43,48,43],
    B7:[35,42,47,42]
  };
  const MEL = {
    A1:[64,64, 67,67, 69,69, 67,67],
    A2:[67,67, 69,69, 71,71, 72,72],
    A3:[72,72, 71,71, 69,69, 67,67],
    B7:[66,66, 66,66, 67,67, 64,64],
    L1:[64,64, 67,67, 69,69, 71,71],
    L2:[71,71, 69,69, 67,67, 66,66],
    L3:[67,67, 64,64, 62,62, 64,64]
  };

  // section builders
  function tremBar(t0, bassMidiArr, melSeq, localBeat){
    const beat = localBeat;
    const is8 = melSeq.length===8;
    for(let s=0; s<4; s++){
      const beatStart = t0 + s*beat;
      // bass
      const bm = bassMidiArr[s%bassMidiArr.length] || bassMidiArr[0];
      AE.pluck(midiHz(bm), jitter(beatStart, 0.004), 1.5*beat, 0.85, 0.20);
      // a m i
      const idxBase = is8 ? (s*2) : (s*4);
      const m1 = melSeq[idxBase] ?? melSeq[melSeq.length-1];
      const m2 = melSeq[idxBase+ (is8?0:1)] ?? m1;
      const m3 = melSeq[idxBase+ (is8?1:2)] ?? m2;
      AE.pluck(midiHz(m1), jitter(beatStart + beat*(1/4), 0.005), 0.8*beat, 0.70, 0.18);
      AE.pluck(midiHz(m2), jitter(beatStart + beat*(2/4), 0.006), 0.75*beat, 0.68, 0.18);
      AE.pluck(midiHz(m3), jitter(beatStart + beat*(3/4), 0.006), 0.70*beat, 0.66, 0.18);
    }
  }

  function rasgHalf(base, chordMidis, beat){
    const seqDown=[0,1,2,3], seqUp=[3,2,1,0];
    const seq = Math.random()<0.5 ? seqDown.concat(seqUp) : seqUp.concat(seqDown);
    seq.forEach((i,k)=>{
      const when = base + (k*beat*0.12);
      const vel = 0.68 + 0.06*Math.sin(k);
      AE.pluck(midiHz(chordMidis[i % chordMidis.length]), jitter(when, 0.004), 1.1*beat, vel, 0.30);
    });
    AE.pluck(midiHz(chordMidis[0]-12), base, 1.5*beat, 0.85, 0.24);
    if(Math.random()<0.75) AE.palma(base + 0.08, 0.20);
  }

  function rasgBar(t0, chordMidis, localBeat){
    rasgHalf(t0, chordMidis, localBeat);
    rasgHalf(t0 + 2*localBeat, chordMidis, localBeat);
  }

  function picadoRun(t0, notes, localBeat, gain=0.75){
    const step = localBeat*0.12;
    notes.forEach((m, i)=>{
      const when = t0 + i*step;
      const vel = gain * (0.9 + 0.1*Math.sin(i*0.7));
      AE.pluck(midiHz(m), jitter(when, 0.003), step*1.2, vel, 0.22);
    });
  }

  const SCORE = []; 
  function addTrem(bass, mel){ SCORE.push({durBeats:4, play:(t,beat)=>tremBar(t,bass,mel,beat)}); }
  function addRasg(vox){ SCORE.push({durBeats:4, play:(t,beat)=>rasgBar(t,vox,beat)}); }
  function addPicado(seqBeats, midiSeq){ SCORE.push({durBeats:seqBeats, play:(t,beat)=>picadoRun(t,midiSeq,beat,0.80)}); }
  function addCadHit(vox){ SCORE.push({durBeats:2, play:(t,beat)=>rasgBar(t,vox,beat)}); }

  for(let k=0;k<2;k++){
    addTrem(BASS.Em, MEL.A1);
    addTrem(BASS.D,  MEL.A2);
    addTrem(BASS.C,  MEL.A3);
    addTrem(BASS.B7, MEL.B7);
  }
  ['Em','D','C','B7','Em','D','C','B7'].forEach(name => addRasg(VOX[name]));
  addTrem(BASS.Em, MEL.L1);
  addTrem(BASS.D,  MEL.L2);
  addTrem(BASS.C,  MEL.L3);
  addTrem(BASS.B7, MEL.B7);
  addPicado(2, [64,66,67,69,71,72,74,76,77,76,74,72,71,69,67,64]);
  addPicado(2, [59,60,62,64,66,67,69,71,72,71,69,67,66,64,62,59]); 
  addCadHit(VOX.Em);
  addCadHit(VOX.B7);
  addCadHit(VOX.Em);

  let playing=false, startAt=0, stopTimer=null;
  async function play(){
    await AE.init();
    if(playing){ pause(); return; }
    playing=true; playBtn.textContent='Pause';
    AE.setReverb(0.3);
    
    const ac=AE.ctx;
    startAt = ac.currentTime + 0.10;
    let t = startAt;
    let elapsed = 0;
    for(const part of SCORE){
      const rb = rubatoAt(elapsed, RUBATO);
      const beat = (60/BASE_BPM) / rb;
      part.play(t, beat);
      const dur = part.durBeats * beat;
      t += dur;
      elapsed += dur;
    }
    const totalDur = t - startAt + 2.0;
    clearTimeout(stopTimer);
    stopTimer = setTimeout(()=>{ if(playing) pause(true); }, Math.ceil(totalDur*1000));
  }
  function pause(silent=false){
    if(!AE.ctx) return;
    playing=false; playBtn.textContent='Play';
    if(!silent){ AE.palma(AE.ctx.currentTime+0.02, 0.18); }
  }

  const playBtn=document.getElementById('playBtn');
  const tabBtn=document.getElementById('tabBtn');
  const fxBtn=document.getElementById('fxBtn');
  const tabPanel=document.getElementById('tabPanel');

  playBtn.addEventListener('click', play);
  addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); play(); } });

  tabBtn.addEventListener('click', ()=>{
    tabPanel.style.display = (tabPanel.style.display==='block') ? 'none' : 'block';
  });
  fxBtn.addEventListener('click', ()=>{
    AE.hq = !AE.hq; fxBtn.textContent = AE.hq ? 'HQ' : 'LQ';
  });

  const TAB = `Alborada Opus Deluxe (Safety Mode)
... (Tab content preserved) ...`;
  tabPanel.textContent = TAB;
})();
</script>
</body>
</html>
