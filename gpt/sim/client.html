
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>DDA Live Sim</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, Arial; margin: 16px; }
    #wrap { display: grid; grid-template-columns: 820px 1fr; gap: 16px; align-items: start; }
    canvas { border: 1px solid #ddd; background: #0b0f14; }
    .panel { padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
    .k { color: #555; }
    .v { font-weight: 600; }
    .row { margin: 6px 0; }
    code { background:#f6f6f6; padding:2px 4px; border-radius:4px;}
  </style>
</head>
<body>
  <h2>DDA Live Sim (WebSockets)</h2>
  <div class="k">Run <code>python server.py</code>, then open this file in your browser.</div>

  <div id="wrap">
    <canvas id="c" width="820" height="620"></canvas>

    <div class="panel">
      <div class="row"><span class="k">ws:</span> <span id="ws" class="v">disconnected</span></div>
      <div class="row"><span class="k">step:</span> <span id="step" class="v">-</span></div>
      <hr/>
      <div class="row"><span class="k">rho (rigidity):</span> <span id="rho" class="v">-</span></div>
      <div class="row"><span class="k">k_eff (openness):</span> <span id="ke" class="v">-</span></div>
      <div class="row"><span class="k">m (pressure):</span> <span id="m" class="v">-</span></div>
      <div class="row"><span class="k">m_crit:</span> <span id="mc" class="v">-</span></div>
      <div class="row"><span class="k">epsilon:</span> <span id="eps" class="v">-</span></div>
      <div class="row"><span class="k">action:</span> <span id="a" class="v">-</span></div>
      <hr/>
      <div class="k">
        Tip: if you want more “snaps,” increase <code>m_pulse</code> or decrease <code>k_base</code>.
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const el = (id)=>document.getElementById(id);

let pts = [];
const MAX_PTS = 2000;

function worldToCanvas(p){
  // auto-scale based on recent points
  const recent = pts.slice(-600);
  if (recent.length < 10) return [canvas.width/2, canvas.height/2];

  let minx=Infinity, maxx=-Infinity, miny=Infinity, maxy=-Infinity;
  for (const q of recent){
    minx = Math.min(minx, q[0]); maxx = Math.max(maxx, q[0]);
    miny = Math.min(miny, q[1]); maxy = Math.max(maxy, q[1]);
  }
  const pad = 0.4;
  const dx = (maxx-minx) || 1;
  const dy = (maxy-miny) || 1;

  const x = (p[0]-minx)/dx;
  const y = (p[1]-miny)/dy;

  const cx = pad*canvas.width + x*(canvas.width*(1-2*pad));
  const cy = pad*canvas.height + (1-y)*(canvas.height*(1-2*pad));
  return [cx, cy];
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // faint grid
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#1f2a37";
  ctx.lineWidth = 1;
  for (let i=1;i<10;i++){
    ctx.beginPath();
    ctx.moveTo(i*canvas.width/10, 0);
    ctx.lineTo(i*canvas.width/10, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i*canvas.height/10);
    ctx.lineTo(canvas.width, i*canvas.height/10);
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;

  if (pts.length < 2) return;

  // path
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#60a5fa";
  ctx.beginPath();
  let [sx, sy] = worldToCanvas(pts[0]);
  ctx.moveTo(sx, sy);
  for (let i=1;i<pts.length;i++){
    const [cx, cy] = worldToCanvas(pts[i]);
    ctx.lineTo(cx, cy);
  }
  ctx.stroke();

  // head point
  const [hx, hy] = worldToCanvas(pts[pts.length-1]);
  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.arc(hx, hy, 4, 0, Math.PI*2);
  ctx.fill();
}

function fmt(x){ return (typeof x === "number") ? x.toFixed(3) : x; }

const ws = new WebSocket("ws://localhost:8765");
ws.onopen = ()=> { el("ws").textContent = "connected"; el("ws").style.color = "#16a34a"; };
ws.onclose = ()=> { el("ws").textContent = "closed"; el("ws").style.color = "#dc2626"; };
ws.onerror = ()=> { el("ws").textContent = "error"; el("ws").style.color = "#dc2626"; };

ws.onmessage = (ev)=>{
  const msg = JSON.parse(ev.data);
  const p = msg.p;
  pts.push(p);
  if (pts.length > MAX_PTS) pts.shift();

  el("step").textContent = msg.step;
  el("rho").textContent = fmt(msg.rho);
  el("ke").textContent = fmt(msg.k_eff);
  el("m").textContent = fmt(msg.m);
  el("mc").textContent = fmt(msg.m_crit);
  el("eps").textContent = fmt(msg.eps);
  el("a").textContent = msg.action;

  draw();
};
</script>
</body>
</html>
